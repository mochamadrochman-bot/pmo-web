<style>
/* ===== Galeri foto proyek per bulan: sorotan (story), timeline, album, bandingkan ===== */
.gl-stories{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.gl-stories::-webkit-scrollbar{display:none}
.gl-st{flex:none;width:86px;border:0;background:none;padding:0;cursor:pointer;text-align:center;color:var(--ink,#132b43);font:inherit}
.gl-ring{width:78px;height:78px;margin:0 auto;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,#0f5fa8,#16b3a6,#f0c35a,#0f5fa8)}
.gl-st.seen .gl-ring{background:var(--line,#d6e0ea)}
.gl-ring>span{display:block;width:100%;height:100%;border-radius:50%;border:3px solid var(--bg,#f2f5f9);background:#13406b center/cover no-repeat}
.gl-st b{display:block;margin-top:6px;font-size:12px;line-height:1.25;font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gl-st small{display:block;font-size:10.5px;color:var(--muted,#5b7085);margin-top:1px}
.gl-st.all .gl-ring{background:var(--soft,#e8f3fb)}
.gl-st.all .gl-ring>span{display:grid;place-items:center;background:var(--card,#fff);color:var(--pri-ink,#0f5fa8)}
.gl-st.all svg{width:26px;height:26px}
.gl-empty-note{font-size:13px;color:var(--muted,#5b7085);padding:6px 2px}
/* story viewer */
.gl-sv{position:fixed;inset:0;z-index:400;background:#05101c;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;animation:glF .2s ease}
.gl-sv[hidden]{display:none}
@keyframes glF{from{opacity:0}}
.gl-sv-stage{position:relative;width:100vw;height:100vh;height:100dvh;background:#000;overflow:hidden;border-radius:0}
@media (min-width:700px){.gl-sv-stage{border-radius:18px;width:min(88vw,1180px);height:min(88vh,780px)}}
.gl-sv-img{position:absolute;inset:0;background:#000 center/contain no-repeat;transition:opacity .25s}
.gl-sv-bg{position:absolute;inset:-30px;background:center/cover no-repeat;filter:blur(28px) brightness(.45);transform:scale(1.1)}
.gl-sv-top{position:absolute;left:0;right:0;top:0;padding:12px 14px 30px;background:linear-gradient(180deg,rgba(0,0,0,.65),transparent);z-index:2}
.gl-bars{display:flex;gap:4px}
.gl-bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;position:relative}
.gl-bars i b{position:absolute;inset:0;width:0;background:#fff}
.gl-bars i.done b{width:100%}
.gl-sv-h{display:flex;align-items:center;gap:10px;margin-top:10px}
.gl-sv-h .av{width:36px;height:36px;border-radius:50%;background:#13406b center/cover;border:2px solid rgba(255,255,255,.7);flex:none}
.gl-sv-h div{flex:1;min-width:0}.gl-sv-h b{display:block;font-size:14px;line-height:1.25}.gl-sv-h small{font-size:12px;opacity:.8}
.gl-x{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;line-height:1;cursor:pointer;flex:none}
.gl-sv-bot{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 16px;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);z-index:2}
.gl-sv-cap{font-size:14.5px;line-height:1.5;margin:0 0 10px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.gl-sv-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gl-chip{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(255,255,255,.16)}
.gl-chip.good{background:#1d8a5f}.gl-chip.warn{background:#a8780c}.gl-chip.bad{background:#b3362f}
.gl-sv-more{margin-left:auto;border:0;border-radius:99px;padding:8px 14px;background:#fff;color:#0b2a47;font:700 12.5px Inter,system-ui,sans-serif;cursor:pointer}
.gl-tap{position:absolute;top:80px;bottom:120px;width:40%;z-index:1;cursor:pointer;border:0;background:transparent}
.gl-tap.l{left:0}.gl-tap.r{right:0;width:60%}
.gl-sv-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;z-index:3;display:none}
@media (min-width:900px){.gl-sv-nav{display:block}.gl-sv-nav.l{left:calc(50% - min(44vw,590px) - 58px)}.gl-sv-nav.r{right:calc(50% - min(44vw,590px) - 58px)}}
/* galeri · OneDrive Photos layout + 4 tema PMO (Biru, Sage, Mocha, Dark) */
.gl-g{--gl-bg:var(--bg,#f3f6fa);--gl-rail:var(--card,#ffffff);--gl-card:var(--card,#ffffff);--gl-tint:var(--tint,#edf2f8);--gl-hover:rgba(15,95,168,.08);--gl-ink:var(--ink,#132b43);--gl-navy:var(--navy,#0c243c);--gl-mut:var(--muted,#52677d);--gl-line:var(--line,#dbe3ee);--gl-soft:var(--soft,#e3f0fb);--gl-pri:var(--pri,#0f5fa8);--gl-pri-ink:var(--pri-ink,#0c5394);--gl-ok:var(--ok,#14724f);--gl-ok-bg:var(--ok-bg,#dcf5e9);--gl-scrub:rgba(15,23,42,.9);--gl-row-h:196px;--gl-gap:5px;position:fixed;inset:0;z-index:390;background:var(--gl-bg);color:var(--gl-ink);display:flex;flex-direction:column;font-family:Inter,system-ui,sans-serif;animation:glF .2s ease}
html[data-accent="sage"]:not([data-theme="dark"]) .gl-g{--gl-bg:#eff4e8;--gl-rail:#f8fbf4;--gl-tint:#e4eed8;--gl-hover:rgba(55,85,52,.09);--gl-ink:#0f2a1d;--gl-navy:#0b2217;--gl-mut:#466149;--gl-line:#cfdcca;--gl-soft:#ddebd0;--gl-pri:#375534;--gl-pri-ink:#2c4a2a;--gl-scrub:rgba(15,42,29,.92)}
html[data-accent="mocha"]:not([data-theme="dark"]) .gl-g{--gl-bg:#efe6d8;--gl-rail:#faf5ec;--gl-card:#fffaf2;--gl-tint:#e7dac6;--gl-hover:rgba(111,78,55,.09);--gl-ink:#3b2a1f;--gl-navy:#2a1c13;--gl-mut:#6c5342;--gl-line:#d6be9f;--gl-soft:#eadbc6;--gl-pri:#6f4e37;--gl-pri-ink:#5a3c28;--gl-scrub:rgba(59,42,31,.92)}
html[data-theme="dark"] .gl-g{--gl-bg:#11161f;--gl-rail:#161d29;--gl-card:#1a2332;--gl-tint:#202a3b;--gl-hover:rgba(125,211,252,.11);--gl-ink:#e7eef7;--gl-navy:#f8fafc;--gl-mut:#98abc0;--gl-line:rgba(255,255,255,.11);--gl-soft:rgba(56,189,248,.16);--gl-pri:#2563eb;--gl-pri-ink:#7dd3fc;--gl-ok:#6ee7b7;--gl-ok-bg:rgba(16,185,129,.18);--gl-scrub:rgba(15,23,42,.95)}
.gl-g[hidden]{display:none!important}
.gl-g :focus-visible{outline:2px solid var(--gl-pri);outline-offset:2px}
.gl-gh{flex:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:58px;padding:8px 18px;background:var(--gl-rail);border-bottom:1px solid var(--gl-line);z-index:20}
.gl-gh-brand{display:flex;align-items:center;gap:10px;min-width:190px}
.gl-gh-ic{width:34px;height:34px;border-radius:10px;background:var(--gl-pri);color:#fff;display:grid;place-items:center;flex:none}
.gl-gh-ic svg{width:18px;height:18px}
.gl-gh h2{margin:0;font-size:16px;font-weight:700;color:var(--gl-navy);line-height:1.2}
.gl-gh h2 small{display:block;font-size:11.5px;font-weight:500;color:var(--gl-mut);margin-top:2px}
.gl-qwrap{position:relative;flex:1;min-width:200px;max-width:440px;display:flex;align-items:center}
.gl-qwrap svg{position:absolute;left:12px;width:15px;height:15px;color:var(--gl-mut);pointer-events:none}
.gl-q{width:100%;height:38px;padding:0 34px 0 36px;border-radius:99px;border:1px solid var(--gl-line);background:var(--gl-tint);color:var(--gl-ink);font:500 13px Inter,system-ui,sans-serif;transition:border-color .15s,background .15s}
.gl-q:focus{outline:0;border-color:var(--gl-pri);background:var(--gl-card)}
.gl-q::-webkit-search-cancel-button{display:none}
.gl-qclr{position:absolute;right:7px;width:24px;height:24px;border:0;border-radius:50%;background:transparent;color:var(--gl-mut);display:none;place-items:center;font-size:15px;cursor:pointer}
.gl-qclr.on{display:grid}
.gl-qclr:hover{background:var(--gl-hover);color:var(--gl-ink)}
.gl-gh-act{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gl-dens{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--gl-tint);border:1px solid var(--gl-line)}
.gl-dens button{border:0;background:transparent;color:var(--gl-mut);padding:5px 9px;border-radius:7px;font:600 12px Inter,system-ui,sans-serif;cursor:pointer}
.gl-dens button.on{background:var(--gl-card);color:var(--gl-pri-ink);box-shadow:0 1px 3px rgba(0,0,0,.10)}
.gl-add{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;height:36px;padding:0 13px;background:var(--gl-pri);color:#fff;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.gl-add:hover{filter:brightness(1.08)}
.gl-add svg{width:15px;height:15px}
.gl-gh .gl-x{width:36px;height:36px;background:var(--gl-card);color:var(--gl-ink);border:1px solid var(--gl-line)}
.gl-gh .gl-x:hover{background:var(--gl-tint)}
.gl-gb{flex:1;min-height:0;display:grid;grid-template-columns:248px minmax(0,1fr);position:relative;overflow:hidden}
.gl-rail{background:var(--gl-rail);border-right:1px solid var(--gl-line);display:flex;flex-direction:column;overflow-y:auto;padding:14px 10px;gap:16px}
.gl-rgrp h3{margin:0 10px 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gl-mut)}
.gl-vbtn,.gl-pchip{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;border-radius:10px;background:transparent;color:var(--gl-ink);font:500 13.5px/1.25 Inter,system-ui,sans-serif;cursor:pointer}
.gl-vbtn{padding:9px 10px}
.gl-vbtn svg{width:17px;height:17px;flex:none;opacity:.85}
.gl-vbtn:hover,.gl-pchip:hover{background:var(--gl-hover)}
.gl-vbtn.on{background:var(--gl-soft);color:var(--gl-pri-ink);font-weight:700}
.gl-vbtn:disabled{opacity:.45;cursor:not-allowed}
.gl-pchip{padding:7px 9px;font-size:13px;gap:9px}
.gl-pchip i{width:28px;height:28px;border-radius:8px;flex:none;background:var(--gl-tint) center/cover no-repeat;border:1px solid rgba(128,128,128,.18);display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:800;color:var(--gl-navy)}
.gl-pchip .gl-pnm{flex:1;min-width:0;line-height:1.25}
.gl-pchip.on{background:var(--gl-pri);color:#fff;font-weight:600}
.gl-pchip.on i{border-color:rgba(255,255,255,.32);color:#fff;background-color:rgba(255,255,255,.16)}
.gl-cnt{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--gl-mut);font-variant-numeric:tabular-nums;flex:none}
.gl-pchip.on .gl-cnt{color:rgba(255,255,255,.86)}
.gl-stat{margin-top:auto;padding:12px;border-radius:12px;background:var(--gl-tint);border:1px solid var(--gl-line);font-size:12px}
.gl-stat b{display:block;color:var(--gl-navy);font-size:13px;margin-bottom:3px}
.gl-stat span{display:block;color:var(--gl-mut);line-height:1.4}
.gl-stat-pb{height:5px;border-radius:99px;background:var(--gl-line);margin-top:8px;overflow:hidden}
.gl-stat-pb i{display:block;height:100%;background:var(--gl-ok);border-radius:99px}
.gl-stage{position:relative;min-width:0;overflow-y:auto;padding:0 36px 48px 22px;scroll-behavior:smooth}
.gl-msec{margin-bottom:22px}
.gl-mhd{position:sticky;top:0;z-index:12;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;padding:14px 4px 10px;background:color-mix(in srgb,var(--gl-bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.gl-mhd h3{margin:0;font-size:20px;font-weight:700;color:var(--gl-navy);letter-spacing:-.01em}
.gl-mmeta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:12.5px;color:var(--gl-mut)}
.gl-mmeta b{color:var(--gl-ink);font-variant-numeric:tabular-nums}
.gl-pok{padding:2px 8px;border-radius:6px;background:var(--gl-ok-bg);color:var(--gl-ok);font-weight:700;font-size:11.5px}
.gl-jgrid{display:flex;flex-wrap:wrap;gap:var(--gl-gap)}
.gl-jgrid::after{content:"";flex-grow:999999999}
.gl-ph{position:relative;height:var(--gl-row-h);flex:150 1 240px;border-radius:8px;overflow:hidden;background:var(--gl-tint);cursor:pointer;border:0;padding:0;text-align:left}
.gl-ph-im{position:absolute;inset:0;background:#13406b center/cover no-repeat;transition:transform .24s ease}
.gl-ph:hover .gl-ph-im,.gl-ph:focus-visible .gl-ph-im{transform:scale(1.03)}
.gl-ph-ov{position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,rgba(6,14,24,.34) 0%,transparent 38%,rgba(6,14,24,.80) 100%);opacity:0;transition:opacity .16s ease}
.gl-ph:hover .gl-ph-ov,.gl-ph:focus-visible .gl-ph-ov{opacity:1}
.gl-ph-tag{align-self:flex-start;padding:2px 7px;border-radius:6px;background:rgba(6,14,24,.70);color:#fff;font:600 11px/1.3 Inter,system-ui,sans-serif;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl-ph-cap{color:#fff;font:600 12.5px/1.35 Inter,system-ui,sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.gl-ph-sub{display:block;font-size:11px;font-weight:500;color:rgba(226,232,240,.88);margin-top:2px}
.gl-scrub{position:fixed;right:8px;top:76px;bottom:20px;width:22px;z-index:25;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:12px}
.gl-sbtn{position:relative;border:0;background:transparent;padding:4px;display:flex;align-items:center;cursor:pointer}
.gl-sdot{width:6px;height:6px;border-radius:99px;background:var(--gl-mut);opacity:.45;transition:width .15s,height .15s,opacity .15s,background .15s}
.gl-sbtn.on .gl-sdot,.gl-sbtn:hover .gl-sdot{width:8px;height:20px;opacity:1;background:var(--gl-pri)}
.gl-slbl{position:absolute;right:20px;white-space:nowrap;padding:4px 9px;border-radius:7px;background:var(--gl-scrub);color:#fff;font:700 11.5px Inter,system-ui,sans-serif;opacity:0;pointer-events:none;transform:translateX(4px);transition:opacity .14s,transform .14s;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.gl-sbtn:hover .gl-slbl,.gl-sbtn.on .gl-slbl{opacity:1;transform:none}
.gl-albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px;padding-top:16px}
.gl-tm{border:1px solid var(--gl-line);border-radius:14px;background:var(--gl-card);padding:0;cursor:pointer;text-align:left;overflow:hidden;font:inherit;color:inherit;position:relative;transition:transform .15s,border-color .15s}
.gl-tm:hover{transform:translateY(-2px);border-color:var(--gl-pri)}
.gl-tm.on{border-color:var(--gl-pri);box-shadow:0 0 0 1px var(--gl-pri)}
.gl-tm .im{aspect-ratio:16/10;background:#13406b center/cover no-repeat}
.gl-tm .tx{padding:11px 13px 13px}
.gl-tm b{display:block;font-size:14.5px;color:var(--gl-navy)}
.gl-tm small{display:block;font-size:12px;color:var(--gl-mut);margin-top:3px}
.gl-tm .pb{height:5px;border-radius:9px;background:var(--gl-line);margin-top:9px;overflow:hidden}.gl-tm .pb i{display:block;height:100%;background:var(--gl-ok)}
.gl-tm .n{position:absolute;top:9px;right:9px;padding:3px 9px;border-radius:99px;background:rgba(5,20,36,.74);color:#fff;font-size:11.5px;font-weight:700}
.gl-none{margin-top:20px;padding:40px 20px;text-align:center;color:var(--gl-mut);border:1px dashed var(--gl-line);border-radius:14px;line-height:1.6}
/* bandingkan */
.gl-cmp-wrap{padding-top:16px;max-width:980px}
.gl-cmp-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.gl-cmp-pick label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gl-mut);margin-bottom:6px}
.gl-cmp-pick select{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--gl-line);background:var(--gl-card);color:var(--gl-ink);font:600 13px Inter,system-ui,sans-serif}
.gl-strip{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:4px}
.gl-strip button{flex:none;width:64px;height:48px;border-radius:8px;border:2px solid transparent;background:#13406b center/cover;cursor:pointer;padding:0}
.gl-strip button.on{border-color:var(--gl-pri)}
.gl-cmp{position:relative;aspect-ratio:16/9;width:min(100%,calc(64vh*16/9));margin:0 auto;border-radius:16px;overflow:hidden;background:#000;user-select:none;touch-action:none;border:1px solid var(--gl-line)}
.gl-cmp .a,.gl-cmp .b{position:absolute;inset:0;background:#000 center/cover no-repeat}
.gl-cmp .b{clip-path:inset(0 0 0 var(--x,50%))}
.gl-cmp .h{position:absolute;top:0;bottom:0;left:var(--x,50%);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.5);pointer-events:none}
.gl-cmp .h::after{content:"⟷";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:#fff;color:#0b2a47;display:grid;place-items:center;font-size:18px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.gl-cmp .lb{position:absolute;top:12px;padding:5px 10px;border-radius:8px;background:rgba(5,20,36,.74);color:#fff;font:700 12px Inter,system-ui,sans-serif}
.gl-cmp .lb.l{left:12px}.gl-cmp .lb.r{right:12px}
.gl-cmp-note{font-size:12.5px;color:var(--gl-mut);margin-top:8px}
@media (max-width:860px){.gl-gb{grid-template-columns:1fr;grid-template-rows:auto 1fr}.gl-rail{flex-direction:row;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--gl-line);gap:6px}.gl-rgrp{display:flex;align-items:center;gap:4px}.gl-rgrp h3,.gl-stat,.gl-scrub,.gl-dens{display:none}.gl-vbtn,.gl-pchip{width:auto;white-space:nowrap}.gl-stage{padding:0 14px 36px}.gl-cmp-pick{grid-template-columns:1fr}}
@media (max-width:640px){.gl-stories{gap:8px;justify-content:space-between}.gl-st{width:64px}.gl-ring{width:60px;height:60px;padding:2px}.gl-ring>span{border-width:2px}.gl-st b{font-size:10.5px}.gl-st small{font-size:9.5px}.gl-st.all svg{width:20px;height:20px}}
@media (max-width:640px){.gl-gh{padding:10px 12px}.gl-qwrap{order:3;flex:1 0 100%;max-width:none}.gl-ph{height:150px;flex:120 1 46%}.gl-cmp{aspect-ratio:4/3}.gl-add span{display:none}}
@media (prefers-reduced-motion:reduce){.gl-ph-im,.gl-ph-ov,.gl-tm,.gl-stage{transition:none!important;scroll-behavior:auto!important}}
body.gl-lock{overflow:hidden}
/* unggah foto */
.gl-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:520;max-width:min(560px,calc(100vw - 32px));padding:12px 16px;border-radius:12px;background:#0b2a47;color:#fff;font:600 13.5px/1.5 Inter,system-ui,sans-serif;box-shadow:0 14px 40px rgba(0,0,0,.3);display:flex;gap:10px;align-items:flex-start}
.gl-toast.bad{background:#a52826}.gl-toast.ok{background:#16734f}
.gl-toast button{margin-left:auto;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:4px 10px;font:700 12px Inter,system-ui,sans-serif;cursor:pointer;flex:none}
.gl-up{position:fixed;inset:0;z-index:450;background:rgba(6,22,38,.5);display:flex;align-items:center;justify-content:center;padding:16px;font-family:Inter,system-ui,sans-serif;animation:glF .18s ease}
.gl-up[hidden]{display:none}
.gl-upc{width:min(860px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--card,#fff);color:var(--ink,#132b43);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
.gl-uph{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line,#e0e8f0)}
.gl-uph h3{margin:0;font-size:17px;color:var(--navy,#073b63);flex:1}.gl-uph h3 small{display:block;font-size:12px;font-weight:500;color:var(--muted,#5b7085);margin-top:2px}
.gl-uph .gl-x{background:var(--tint,#f4f8fc);color:var(--ink,#132b43);border:1px solid var(--line,#e0e8f0)}
.gl-upb{flex:1;overflow:auto;padding:16px 20px}
.gl-uprow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.gl-uprow label{font-size:12px;font-weight:700;color:var(--muted,#5b7085);text-transform:uppercase;letter-spacing:.05em}
.gl-uprow select{padding:8px 10px;border-radius:10px;border:1px solid var(--line,#e0e8f0);background:var(--card,#fff);color:var(--ink,#132b43);font:600 13px Inter,system-ui,sans-serif}
.gl-uprow a{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--pri-ink,#0f5fa8);text-decoration:none}
.gl-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:26px 16px;border:2px dashed var(--line,#cdd9e5);border-radius:14px;background:var(--tint,#f4f8fc);text-align:center;cursor:pointer;color:var(--muted,#5b7085);font-size:13px}
.gl-drop.over{border-color:var(--pri,#0f5fa8);background:var(--soft,#e8f3fb)}
.gl-drop b{color:var(--ink,#132b43);font-size:14.5px}
.gl-drop svg{width:30px;height:30px;color:var(--pri-ink,#0f5fa8)}
.gl-note{padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.55;margin-bottom:12px}
.gl-note.warn{background:var(--warn-bg,#fff0bd);color:var(--warn,#8f6100)}.gl-note.bad{background:var(--bad-bg,#ffe3df);color:var(--bad,#c0302f)}
.gl-note .gl-nbtn{display:inline-block;margin-top:8px;border:0;border-radius:9px;padding:7px 12px;background:#0f5fa8;color:#fff;font:700 12.5px Inter,system-ui,sans-serif;cursor:pointer}
.gl-uplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.gl-upi{position:relative;border:1px solid var(--line,#e0e8f0);border-radius:12px;overflow:hidden;background:var(--card,#fff)}
.gl-upi .th{aspect-ratio:4/3;background:#13406b center/cover}
.gl-upi .rm{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(5,20,36,.7);color:#fff;font-size:16px;cursor:pointer}
.gl-upi input{width:100%;border:0;border-top:1px solid var(--line,#e0e8f0);padding:8px 10px;font:500 12.5px Inter,system-ui,sans-serif;background:var(--card,#fff);color:var(--ink,#132b43);box-sizing:border-box}
.gl-upi .meta{display:flex;justify-content:space-between;gap:6px;padding:6px 10px 8px;font-size:11px;color:var(--muted,#5b7085)}
.gl-upi .meta span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gl-upi .meta b{font-weight:700;white-space:nowrap;flex:none}.gl-upi .meta .ok{color:var(--ok,#16875d)}.gl-upi .meta .err{color:var(--bad,#c0302f)}
.gl-upi .bar{height:3px;background:var(--line,#e0e8f0)}.gl-upi .bar i{display:block;height:100%;width:0;background:var(--pri,#0f5fa8);transition:width .3s}
.gl-upf{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--line,#e0e8f0);background:var(--tint,#f4f8fc)}
.gl-upf span{font-size:12.5px;color:var(--muted,#5b7085);flex:1}
.gl-upf button{border:1px solid var(--line,#e0e8f0);border-radius:10px;padding:10px 16px;background:var(--card,#fff);color:var(--ink,#132b43);font:700 13px Inter,system-ui,sans-serif;cursor:pointer}
.gl-upf button.pri{background:#0f5fa8;border-color:#0f5fa8;color:#fff}.gl-upf button:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:640px){.gl-uplist{grid-template-columns:repeat(2,minmax(0,1fr))}.gl-upf{flex-wrap:wrap}.gl-upf span{flex-basis:100%}}


.gl-photo-delete,.gl-upload-delete{border:1px solid #c95858;background:#702b2b;color:#fff;border-radius:9px;padding:8px 12px;min-height:40px;cursor:pointer;font:inherit}
.gl-upload-delete{position:relative;margin:8px;font-size:12px}
.gl-del-confirm{position:fixed;inset:0;z-index:100500;background:#0009;display:flex;align-items:center;justify-content:center;padding:18px}
.gl-del-card{width:min(460px,100%);max-height:85vh;overflow:auto;box-sizing:border-box;background:var(--card,#fff);color:var(--ink,#132b43);border:1px solid var(--line,#dce5ed);border-radius:18px;padding:24px;box-shadow:0 20px 80px #0005;font:inherit}
.gl-del-card h3{margin:0 0 12px}.gl-del-card p{line-height:1.6}.gl-del-caption{color:var(--muted,#637890);overflow-wrap:anywhere}.gl-del-card>div{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}.gl-del-card button{font:inherit;min-height:44px;border-radius:10px;padding:10px 18px;border:1px solid var(--line,#ccd8e2);cursor:pointer}.gl-del-card [data-confirm]{background:#b83030;color:#fff;border-color:#b83030}.gl-del-card small{display:block;color:#dc6262;margin-top:12px;line-height:1.5}.gl-del-card button:disabled{opacity:.6;cursor:wait}

    up.querySelectorAll('[data-delete]').forEach(function(b){b.onclick=function(){var index=+b.getAttribute('data-delete'),x=U.items[index];askDeletePhoto(U.p,{id:x.savedId,cap:x.cap||x.file.name},function(){U.items.splice(index,1);if(x.url)URL.revokeObjectURL(x.url);renderUp()})}});
    up.querySelector('#glUpGo').onclick=startUpload}
  function addFiles(list){var bad=0;Array.prototype.forEach.call(list||[],function(f){if(!/^image\/(jpeg|png|webp)$/.test(f.type)){bad++;return}if(U.items.length>=30){bad++;return}U.items.push({file:f,url:URL.createObjectURL(f),cap:'',st:'new'})});
    if(bad)toast(bad+' file dilewati (bukan JPG/PNG/WEBP atau melebihi 30 foto per unggahan).','bad');renderUp()}
  function shrink(f){return new Promise(function(res,rej){var img=new Image();img.onload=function(){var M=2560,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,M/Math.max(w,h));
      if(k===1&&f.size<=3.5*1048576){var rd=new FileReader();rd.onload=function(){res({mime:f.type,base64:String(rd.result).split(',')[1],size:f.size})};rd.onerror=rej;rd.readAsDataURL(f);return}
      var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
      var u=c.toDataURL('image/jpeg',0.86);res({mime:'image/jpeg',base64:u.split(',')[1],size:Math.round(u.length*0.75)})};img.onerror=function(){rej(new Error('Foto tidak dapat dibaca.'))};img.src=URL.createObjectURL(f)})}
  function startUpload(){if(U.busy)return;var queue=U.items.filter(function(x){return x.st!=='ok'});if(!queue.length)return;U.busy=true;var ok=0,fail=0,i=0;renderUp();
    var next=function(){if(i>=queue.length){U.busy=false;renderUp();if(ok)galleryAfterUpload();toast(fail?ok+' foto terunggah, '+fail+' gagal. Periksa foto yang gagal lalu coba lagi.':ok+' foto berhasil diunggah ke '+(U.info&&U.info.folderName?U.info.folderName+' › ':'')+'Galeri Foto › '+U.month+'.',fail?'bad':'ok');return}
      var x=queue[i++];x.st='prep';x.err='';renderUp();
      shrink(x.file).then(function(o){x.out=o;x.st='up';renderUp();var nmf=x.file.name.replace(/\.[^.]+$/,'')+(o.mime==='image/jpeg'&&!/\.jpe?g$/i.test(x.file.name)?'.jpg':x.file.name.match(/\.[^.]+$/)?x.file.name.match(/\.[^.]+$/)[0]:'.jpg');
        google.script.run.withSuccessHandler(function(r){x.savedId=r&&r.id;x.st='ok';ok++;next()}).withFailureHandler(function(e){x.st='err';x.err=e&&e.message||'Gagal mengunggah.';fail++;if(/belum diatur/.test(x.err)){U.info=U.info||{};U.info.folderSet=false}next()}).uploadGalleryPhoto(tok(),U.p.id,U.month,{name:nmf,mime:o.mime,base64:o.base64,caption:x.cap})
      }).catch(function(e){x.st='err';x.err=e.message;fail++;next()})};
    next()}
  function galleryAfterUpload(){G.month=U.month;refreshAll()}
  window.pmoGallery={renderStories:renderStories,openStory:openStory,open:open,refresh:refresh};
  var host=document.getElementById('glStories');if(host&&tok())renderStories(host);
})();
</script>
