  function openUpload(p,month){if(p.canManage!==true){toast('Tambah dan hapus foto hanya untuk Admin atau INPUT/PIC proyek ini.','bad');return}var now=new Date(),cur=now.getFullYear()+'-'+('0'+(now.getMonth()+1)).slice(-2);
    U={p:p,month:month||cur,items:[],busy:false,info:null};
    if(!up){up=document.createElement('div');up.className='gl-up';up.hidden=true;up.setAttribute('role','dialog');up.setAttribute('aria-modal','true');document.body.appendChild(up);up.addEventListener('click',function(e){if(e.target===up&&!U.busy)closeUpload()})}
    up.hidden=false;renderUp();
    google.script.run.withSuccessHandler(function(r){U.info=r;renderUp()}).withFailureHandler(function(e){U.info={error:e&&e.message||'Info folder tidak dapat dimuat.'};renderUp()}).getGalleryUploadInfo(tok(),p.id)}
  function closeUpload(){if(U.items.some(function(x){return x.st==='ok'})){refreshAll()}up.hidden=true;U.items.forEach(function(x){if(x.url)URL.revokeObjectURL(x.url)})}
  function refreshAll(){IDX=null;try{localStorage.removeItem('pmoGalIdx')}catch(e){}load(function(){if(gl&&!gl.hidden)renderG();if(storyHost)renderStories(storyHost)})}
  function fmtSize(b){return b>1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.round(b/1024)+' KB'}
  function renderUp(){var p=U.p,info=U.info,pending=U.items.filter(function(x){return x.st!=='ok'}).length,done=U.items.filter(function(x){return x.st==='ok'}).length;
    var noFolder=info&&info.folderSet===false,err=info&&info.error;
    var h='<div class="gl-upc"><div class="gl-uph"><h3>Tambah foto · '+esc(nm(p.name))+'<small>Pilih foto dari komputer atau HP, periksa pratinjau, lalu unggah ke Google Drive proyek.</small></h3><button type="button" class="gl-x" aria-label="Tutup">×</button></div><div class="gl-upb">';
    if(err)h+='<div class="gl-note bad">'+esc(err)+'</div>';
    else if(noFolder)h+='<div class="gl-note warn"><b>Folder Google Drive proyek belum diatur.</b><br>Foto disimpan di folder Drive milik tim proyek. Isi dulu link folder di menu <b>Tambah / Edit Proyek › Folder Google Drive proyek</b>, lalu bagikan folder itu ke akun <b>'+esc(info.account||'pemilik dashboard')+'</b> sebagai Editor.'+(info.role==='ADMIN'||info.role==='INPUT'||info.role==='PIC'?'<br><button type="button" class="gl-nbtn" id="glGoSetup">Buka Tambah / Edit Proyek</button>':'')+'</div>';
    h+='<div class="gl-uprow"><label for="glUpMonth">Bulan</label><select id="glUpMonth"'+(U.busy?' disabled':'')+'>'+monthOpts(U.month)+'</select>'+(info&&info.folderSet?'<a href="#" id="glOpenFolder">Buka folder Drive ↗</a>':'')+'</div>';
    if(!noFolder&&!err)h+='<label class="gl-drop" id="glDrop"><input type="file" id="glFiles" accept="image/jpeg,image/png,image/webp" multiple hidden'+(U.busy?' disabled':'')+'>'+SV('<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/>')+'<b>Pilih foto</b><span>atau seret beberapa foto ke sini · JPG, PNG, WEBP · foto besar otomatis diperkecil</span></label>';
    if(U.items.length)h+='<div class="gl-uplist">'+U.items.map(function(x,i){var stx=x.st==='ok'?'<b class="ok">✓ Terunggah</b>':x.st==='err'?'<b class="err">Gagal</b>':x.st==='up'?'<b>Mengunggah…</b>':x.st==='prep'?'<b>Menyiapkan…</b>':'<span>Siap</span>';
      return '<div class="gl-upi"><div class="th" style="background-image:url(\''+x.url+'\')"></div>'+(x.st==='ok'&&x.savedId&&!U.busy?'<button type="button" class="gl-upload-delete" data-delete="'+i+'">Hapus dari Drive</button>':'')+(x.st==='ok'||U.busy?'':'<button type="button" class="rm" data-i="'+i+'" aria-label="Hapus">×</button>')+'<input type="text" data-i="'+i+'" maxlength="160" placeholder="Keterangan foto (opsional)" value="'+esc(x.cap)+'"'+(x.st==='ok'||U.busy?' disabled':'')+'><div class="bar"><i style="width:'+(x.st==='ok'?100:x.st==='up'?60:x.st==='prep'?25:0)+'%"></i></div><div class="meta"><span>'+esc(x.file.name.slice(0,24))+' · '+fmtSize(x.out?x.out.size:x.file.size)+'</span>'+stx+'</div>'+(x.err?'<div class="meta"><span class="err">'+esc(x.err)+'</span></div>':'')+'</div>'}).join('')+'</div>';
    h+='</div><div class="gl-upf"><span>'+(U.items.length?U.items.length+' foto dipilih'+(done?' · '+done+' terunggah':''):'Belum ada foto dipilih')+'</span><button type="button" id="glUpClose">'+(done&&!pending?'Selesai':'Tutup')+'</button><button type="button" class="pri" id="glUpGo"'+(!pending||U.busy||noFolder||err?' disabled':'')+'>'+(U.busy?'Mengunggah…':'Unggah '+(pending||'')+' foto')+'</button></div></div>';
    up.innerHTML=h;
    up.querySelector('.gl-x').onclick=function(){if(!U.busy)closeUpload()};up.querySelector('#glUpClose').onclick=function(){if(!U.busy)closeUpload()};
    var gs=up.querySelector('#glGoSetup');if(gs)gs.onclick=function(){goSetup(p.name)};
    var mo=up.querySelector('#glUpMonth');mo.onchange=function(){U.month=mo.value};
    var of=up.querySelector('#glOpenFolder');if(of)of.onclick=function(e){e.preventDefault();google.script.run.withSuccessHandler(function(r){if(r&&r.url)window.open(r.url,'_blank','noopener')}).withFailureHandler(function(e){toast(e&&e.message||'Folder tidak dapat dibuka.','bad')}).getGalleryFolderUrl(tok(),p.id,U.month)};
    var fi=up.querySelector('#glFiles'),dr=up.querySelector('#glDrop');
    if(fi)fi.onchange=function(){addFiles(fi.files);fi.value=''};
    if(dr){['dragenter','dragover'].forEach(function(ev){dr.addEventListener(ev,function(e){e.preventDefault();dr.classList.add('over')})});['dragleave','drop'].forEach(function(ev){dr.addEventListener(ev,function(e){e.preventDefault();dr.classList.remove('over')})});dr.addEventListener('drop',function(e){if(!U.busy)addFiles(e.dataTransfer.files)})}
    up.querySelectorAll('.rm').forEach(function(b){b.onclick=function(){var x=U.items.splice(+b.getAttribute('data-i'),1)[0];if(x&&x.url)URL.revokeObjectURL(x.url);renderUp()}});
    up.querySelectorAll('.gl-upi input').forEach(function(inp){inp.oninput=function(){U.items[+inp.getAttribute('data-i')].cap=inp.value}});
    up.querySelectorAll('[data-delete]').forEach(function(b){b.onclick=function(){var index=+b.getAttribute('data-delete'),x=U.items[index];askDeletePhoto(U.p,{id:x.savedId,cap:x.cap||x.file.name},function(){U.items.splice(index,1);if(x.url)URL.revokeObjectURL(x.url);renderUp()})}});
    up.querySelector('#glUpGo').onclick=startUpload}
  function addFiles(list){var bad=0;Array.prototype.forEach.call(list||[],function(f){if(!/^image\/(jpeg|png|webp)$/.test(f.type)){bad++;return}if(U.items.length>=30){bad++;return}U.items.push({file:f,url:URL.createObjectURL(f),cap:'',st:'new'})});
    if(bad)toast(bad+' file dilewati (bukan JPG/PNG/WEBP atau melebihi 30 foto per unggahan).','bad');renderUp()}
  function shrink(f){return new Promise(function(res,rej){var img=new Image();img.onload=function(){var M=2560,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,M/Math.max(w,h));
      if(k===1&&f.size<=3.5*1048576){var rd=new FileReader();rd.onload=function(){res({mime:f.type,base64:String(rd.result).split(',')[1],size:f.size})};rd.onerror=rej;rd.readAsDataURL(f);return}
      var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
      var u=c.toDataURL('image/jpeg',0.86);res({mime:'image/jpeg',base64:u.split(',')[1],size:Math.round(u.length*0.75)})};img.onerror=function(){rej(new Error('Foto tidak dapat dibaca.'))};img.src=URL.createObjectURL(f)})}
  function startUpload(){if(U.busy)return;var queue=U.items.filter(function(x){return x.st!=='ok'});if(!queue.length)return;U.busy=true;var ok=0,fail=0,i=0;renderUp();
    var next=function(){if(i>=queue.length){U.busy=false;renderUp();if(ok)galleryAfterUpload();toast(fail?ok+' foto terunggah, '+fail+' gagal. Periksa foto yang gagal lalu coba lagi.':ok+' foto berhasil diunggah ke '+(U.info&&U.info.folderName?U.info.folderName+' › ':'')+'Galeri Foto › '+U.month+'.',fail?'bad':'ok');return}
      var x=queue[i++];x.st='prep';x.err='';renderUp();
      shrink(x.file).then(function(o){x.out=o;x.st='up';renderUp();var nmf=x.file.name.replace(/\.[^.]+$/,'')+(o.mime==='image/jpeg'&&!/\.jpe?g$/i.test(x.file.name)?'.jpg':x.file.name.match(/\.[^.]+$/)?x.file.name.match(/\.[^.]+$/)[0]:'.jpg');
        google.script.run.withSuccessHandler(function(r){x.savedId=r&&r.id;x.st='ok';ok++;next()}).withFailureHandler(function(e){x.st='err';x.err=e&&e.message||'Gagal mengunggah.';fail++;if(/belum diatur/.test(x.err)){U.info=U.info||{};U.info.folderSet=false}next()}).uploadGalleryPhoto(tok(),U.p.id,U.month,{name:nmf,mime:o.mime,base64:o.base64,caption:x.cap})
      }).catch(function(e){x.st='err';x.err=e.message;fail++;next()})};
    next()}
  function galleryAfterUpload(){G.month=U.month;refreshAll()}
  window.pmoGallery={renderStories:renderStories,openStory:openStory,open:open,refresh:refresh};
  var host=document.getElementById('glStories');if(host&&tok())renderStories(host);
})();
</script>
