function drawCurve(){

/* ---------- pola tahap (umum) ---------- */
const STG4=['IFR','IFA','IFC','IFI'];
function polaW(k){const v=D&&D.params&&D.params.pola&&D.params.pola[k];return Array.isArray(v)&&v.length===4?v.map(Number):null}
function pwOf(d){return d.pw||polaW(d.pola)||[0,0,0,0]}
function usedStg(w){return STG4.filter(function(k,i){return w[i]>0})}
function polaNm(k,P){P=P||D.params||{};return (P.polaName&&P.polaName[k])||({P1:'Review penuh',P2:'Tanpa IFR',P3:'Tanpa IFA',P4:'Informasi (IFI saja)',P5:'Langsung IFC',P6:'Review + informasi akhir'})[k]||k}
function isDwg(d){return /DRAWING|DED|GAMBAR|DWG/i.test(d.type||'')}
function abOf(d){return ((D.asbuilt||{})[String(d.no).toUpperCase()])||[]}

/* ---------- kelola EDL ---------- */
let E=null;
function edlSig(d){return [d.no,d.name,d.disc,d.type,d.wbs,Number(d.w),d.pola,d.m||'',d.p.join('|'),d.note||'',!!d.batal]}
function edlInit(){
  const P=D.params||{pola:{},polaName:{}};
  E={rev:D.setting.rev,pola:JSON.parse(JSON.stringify(P.pola||{})),polaName:{},docs:[],orig:{},q:'',disc:'',show:'all',page:1,note:'',seq:0};
  Object.keys(E.pola).forEach(function(k){E.polaName[k]=polaNm(k,P)});
  E.docs=D.baseline.concat(D.cancelled||[]).map(function(d){return {key:'o:'+d.no,from:d.no,no:d.no,name:d.name||'',disc:d.disc||'',type:d.type||'',wbs:d.wbs||'',w:Number(d.w)||0,pola:d.pola,m:d.m||'',p:(d.p||['','','','']).slice(),note:d.note||'',batal:!!d.batal}});
  E.docs.forEach(function(d){E.orig[d.key]=JSON.stringify(edlSig(d))});
  E.origPola=JSON.stringify(E.pola)+JSON.stringify(E.polaName);
}
function edlState(d){
  if(!d.from)return 'new';
  const o=JSON.parse(E.orig[d.key]);
  if(d.batal&&!o[10])return 'cancel';if(!d.batal&&o[10])return 'restore';
  if(d.no!==d.from)return 'renum';
  return JSON.stringify(edlSig(d))===E.orig[d.key]?'':'edit';
}
function edlPolaDirty(){return JSON.stringify(E.pola)+JSON.stringify(E.polaName)!==E.origPola}
function edlStats(){
  const st={new:0,edit:0,renum:0,cancel:0,restore:0},act=E.docs.filter(function(d){return !d.batal});
  E.docs.forEach(function(d){const s=edlState(d);if(s)st[s]++});
  const tot=act.reduce(function(a,d){return a+(Number(d.w)||0)},0);
  st.n=st.new+st.edit+st.renum+st.cancel+st.restore;st.active=act.length;st.batal=E.docs.length-act.length;st.total=tot;st.pola=edlPolaDirty();
  return st;
}
const EDL_BADGE={new:['Baru','b-new'],edit:['Diubah','b-edit'],renum:['Ganti nomor','b-renum'],cancel:['Dibatalkan','b-cancel'],restore:['Dipulihkan','b-new']};

/* tempel banyak baris dari Excel */
function edlParseDate(s){s=String(s||'').trim();if(!s)return '';let m;
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s)))return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  if((m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/.exec(s))){let y=+m[3];if(y<100)y+=2000;return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  const MON={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,MEI:5,JUN:6,JUL:7,AUG:8,AGU:8,AGS:8,SEP:9,OCT:10,OKT:10,NOV:11,DEC:12,DES:12};
  if((m=/^(\d{1,2})[\s\-]([A-Za-z]{3})[A-Za-z]*[\s\-](\d{2,4})$/.exec(s))&&MON[m[2].toUpperCase()]){let y=+m[3];if(y<100)y+=2000;return y+'-'+String(MON[m[2].toUpperCase()]).padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  return null}
function edlPaste(){
  let rows=[];
  const draw=function(){
    $('edlBody').innerHTML='<div class="dm-h"><div><h2>Tempel dokumen dari Excel</h2><p>Salin baris dari Excel (tanpa judul kolom) dengan urutan kolom berikut, lalu tempel di kotak. Tanggal boleh dd/mm/yyyy atau yyyy-mm-dd.</p></div><button type="button" class="icon-btn x" aria-label="Tutup" onclick="edlClose()"><i class="ic" data-ic="x"></i></button></div>'+
      '<div class="dm-b"><div class="sg">'+['NOMOR','NAMA','DISIPLIN','JENIS','POLA','BOBOT_%','MULAI','IFR','IFA','IFC','IFI'].map(function(c,i){return '<span><b>'+(i+1)+'</b> '+c+'</span>'}).join('')+'</div>'+
      '<textarea class="inp" id="pTxt" rows="8" placeholder="C-02-40-2340-26-07&#9;DED Detail Fender&#9;SIPIL&#9;DED / DRAWING&#9;P1&#9;0,25&#9;01/12/2026&#9;15/12/2026&#9;05/01/2027&#9;26/01/2027"></textarea>'+
      '<div id="pRes"></div><div class="row" style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn" onclick="edlClose()">Batal</button><button type="button" class="btn pri" id="pOk" disabled><i class="ic" data-ic="plus"></i>Tambahkan</button></div></div>';
    paint($('edlBody'));

  };
  const parse=function(){
    const txt=$('pTxt').value.replace(/\r/g,'');rows=[];const seen={};

      if(String(c[5]||'').indexOf(',')<0&&/^\d+\.\d+$/.test(String(c[5]||'')))x.w=Number(c[5]);
      if(!x.no)er.push('nomor kosong');if(!x.name)er.push('nama kosong');
      if(x.no&&(seen[x.no]||E.docs.some(function(o){return o.no===x.no})))er.push('nomor sudah ada');seen[x.no]=1;

      if(w){STG4.forEach(function(k,i){if(w[i]>0&&!x.p[i])er.push(k+' kosong');if(!(w[i]>0)&&x.p[i])x.p[i]=''})}

}

    (h.length?h.slice().reverse().map(function(r){return '<tr><td class="n"><b>'+r.week+'</b></td><td class="n">'+fd(r.cutoff)+'</td><td class="n">'+pc(r.plan)+'</td><td class="n">'+pc(r.real)+'</td><td class="n '+(r.dev<0?'neg':'pos')+'">'+sg(r.dev)+'</td><td class="n">'+nf(r.done)+'</td><td class="n">'+nf(r.wait)+(r.waitLong?' <small class="neg">('+r.waitLong+' lama)</small>':'')+'</td><td class="n">'+nf(r.resub)+'</td><td class="n">'+nf(r.late)+'</td><td><small>'+esc(r.filledBy||'–')+'<br>'+esc(r.by)+' · '+esc(r.at)+'</small></td></tr>'}).join(''):'<tr><td colspan="10" class="empty">Belum ada unggahan realisasi.</td></tr>')+'</tbody></table></div></div>';
  el.innerHTML=x;paint(el);bindDrop($('dropR'),'real');
  $('wSel').onchange=function(){realWeek=Number(this.value);upR=null;renderReal()};
}
