    if (rKode) for (let r = rKode + 1; r <= rKode + 6; r++) { if (Pm['A' + r] === undefined || Pm['A' + r] === '') continue; codes.push([Pm['A' + r], String(Pm['B' + r] || ''), String(Pm['C' + r] || '').trim().toUpperCase(), String(Pm['D' + r] || '')]); }

    if (errs.length) return { parseErrors: errs };
