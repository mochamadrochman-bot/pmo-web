<style>
/* ===== Asisten PMO (AI) ===== */
.aic-fab{position:fixed;right:20px;bottom:20px;z-index:2500;display:flex;flex-direction:row-reverse;align-items:center;gap:0;height:56px;padding:5px;border:1px solid var(--line,#e0e8f0);border-radius:999px;background:var(--card,#fff);box-shadow:0 8px 28px rgba(7,40,70,.22);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,border-color .22s ease,padding .22s ease}
.aic-fab[hidden]{display:none!important}
.aic-fab>.aic-av{position:relative;width:44px;height:44px;border-radius:50%;background-color:var(--soft,#e8f3fb);background-size:165%;background-position:32.6% 6%;box-shadow:0 0 0 2px var(--card,#fff),0 0 0 3.5px var(--pri2,#087fc1);flex:none}
.aic-fab>.aic-av::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#16a34a;border:2px solid var(--card,#fff)}
.aic-fab span{position:static;transform:none;max-width:0;overflow:hidden;white-space:nowrap;padding:0;border:0;background:transparent;box-shadow:none;color:var(--navy,#073b63);font:700 13px/1.25 Inter,system-ui,-apple-system,sans-serif;text-align:left;opacity:0;pointer-events:none;transition:max-width .26s cubic-bezier(.2,.8,.2,1),opacity .2s ease,padding .22s ease}
.aic-fab span::after{content:"● Tanyakan data proyek";display:block;margin-top:2px;font-size:11px;font-weight:600;color:var(--ok,#16875d)}
.aic-fab.is-minimized span::after{content:"● Lanjutkan percakapan";color:var(--pri-ink,var(--pri,#0f5fa8))}
.aic-fab:hover,.aic-fab:focus-visible{transform:translateY(-2px);border-color:var(--pri2,#087fc1);box-shadow:0 12px 34px rgba(8,127,193,.28);padding:5px 6px 5px 16px}
.aic-fab:hover span,.aic-fab:focus-visible span{max-width:210px;opacity:1;padding-right:10px}
.aic-fab:focus-visible{outline:3px solid var(--pri2,#087fc1);outline-offset:2px}
.aic-av{display:block;flex:none;border-radius:50%;background-color:var(--soft,#e8f3fb);background-image:var(--aic-av);background-repeat:no-repeat;background-size:160%;background-position:32.6% 3.9%}
.aic{position:fixed;top:0;right:0;bottom:0;z-index:2600;width:440px;max-width:100%;display:flex;flex-direction:column;background:var(--card,#fff);color:var(--ink,#132b43);border-left:1px solid var(--line,#e0e8f0);box-shadow:-18px 0 40px rgba(5,20,40,.2);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px}
.aic[hidden]{display:none!important}
.aic *{box-sizing:border-box}
.aic button{font-family:inherit}
.aic-h{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 14px;border-bottom:1px solid var(--line,#e0e8f0);flex:none}
.aic-h>.aic-av{width:40px;height:40px;box-shadow:0 0 0 2px var(--card,#fff),0 0 0 3.5px var(--pri2,#087fc1)}
.aic-h .grow{flex:1;min-width:0}
.aic-h .grow b{display:block;font-size:14.5px;line-height:1.25;color:var(--navy,#073b63);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aic-h .grow small{display:block;margin-top:2px;font-size:11.5px;color:var(--muted,#5b7085);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aic-tools{display:flex;align-items:center;gap:2px;flex:none}
.aic-tools .sep{width:1px;height:20px;margin:0 3px;background:var(--line,#e0e8f0)}
.aic-ib{position:relative;width:32px;height:32px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:8px;background:transparent;color:var(--muted,#5b7085);cursor:pointer}
.aic-ib svg{width:18px;height:18px}
.aic-ib:hover,.aic-ib[aria-pressed=true]{background:var(--soft,#e8f3fb);color:var(--pri-ink,var(--pri,#0f5fa8))}
.aic-ib:focus-visible,.aic-act:focus-visible,.aic-box button:focus-visible{outline:2px solid var(--pri2,#087fc1);outline-offset:1px}
.aic-ib .dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 2px var(--card,#fff)}
.aic-ib .dot[hidden]{display:none}
.aic-vbar{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--line,#e0e8f0);background:var(--tint,#f4f8fc);font-size:12px;color:var(--muted,#5b7085);flex:none}
.aic-vbar[hidden]{display:none}
.aic-vbar>i{width:8px;height:8px;border-radius:50%;background:#d69614;flex:none}
.aic-vbar.on>i{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.18)}
.aic-vbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aic-vbar button{flex:none;padding:3px 8px;border:0;border-radius:6px;background:none;color:var(--pri-ink,var(--pri,#0f5fa8));font-size:12px;font-weight:600;cursor:pointer}
.aic-vbar button:hover{background:var(--soft,#e8f3fb)}
.aic-main{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.aic-b{flex:1;overflow:auto;padding:16px 16px 10px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
.aic-hi{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--soft,#e8f3fb)}
.aic-hi img{width:68px;height:68px;flex:none;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(5,30,60,.2))}
.aic-hi b{display:block;color:var(--navy,#073b63);font-size:14.5px}
.aic-hi span{display:block;margin-top:3px;font-size:12.5px;line-height:1.5;color:var(--muted,#5b7085)}
.aic-hi .warn{display:block;margin-top:6px;color:var(--bad,#c0302f);font-weight:700}
.aic-sug{display:flex;flex-direction:column;gap:6px}
.aic-sug p{margin:2px 0 2px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#5b7085)}
.aic-sug button{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border:1px solid var(--line,#e0e8f0);border-radius:10px;background:var(--card,#fff);color:var(--ink,#132b43);font-size:13px;text-align:left;cursor:pointer}
.aic-sug button:hover{border-color:var(--pri2,#087fc1);color:var(--pri-ink,var(--pri,#0f5fa8))}
.aic-sug button svg{width:14px;height:14px;flex:none;color:var(--pri2,#087fc1)}
.aic-q{align-self:flex-end;max-width:85%;padding:9px 13px;border-radius:14px 14px 4px 14px;background:var(--pri,#0f5fa8);color:#fff;font-size:13.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.aic-row{display:flex;gap:9px;align-items:flex-start}
.aic-row>.aic-av{width:28px;height:28px;margin-top:2px}
.aic-a{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line,#e0e8f0);border-radius:4px 14px 14px 14px;background:var(--card,#fff);font-size:13.5px;line-height:1.62;overflow-wrap:anywhere}
.aic-a h4{margin:4px 0 6px;font-size:13.8px;color:var(--navy,#073b63)}
.aic-a p{margin:0 0 8px}.aic-a ul{margin:2px 0 9px;padding-left:18px}.aic-a li{margin:3px 0}
.aic-a>:last-child{margin-bottom:0}
.aic-a .aic-err{margin:0;color:var(--bad,#c0302f)}
.aic-tw{margin:4px 0 10px;overflow-x:auto;border:1px solid var(--line,#e0e8f0);border-radius:10px}
.aic-a table{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.45}
.aic-a th,.aic-a td{padding:6px 9px;border-bottom:1px solid var(--line,#e0e8f0);text-align:left;vertical-align:top}
.aic-a th{background:var(--tint,#f4f8fc);color:var(--navy,#073b63);font-weight:700;white-space:nowrap}
.aic-a tr:last-child td{border-bottom:0}
.aic-a td.n,.aic-a th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.aic-af{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line,#e0e8f0);font-size:11px;color:var(--muted,#5b7085)}
.aic-af .src{flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aic-act{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border:0;border-radius:6px;background:none;color:var(--pri-ink,var(--pri,#0f5fa8));font-size:11.5px;font-weight:600;cursor:pointer}
.aic-act:hover{background:var(--soft,#e8f3fb)}.aic-act:disabled{opacity:.45;cursor:not-allowed}
.aic-act svg{width:14px;height:14px}
.aic-det{flex-basis:100%}
.aic-det summary{display:inline-flex;align-items:center;gap:4px;cursor:pointer;list-style:none;color:var(--muted,#5b7085)}
.aic-det summary::-webkit-details-marker{display:none}
.aic-det summary:hover{color:var(--pri-ink,var(--pri,#0f5fa8))}
.aic-det div{margin-top:4px;line-height:1.5}
.aic-voice-note{font-size:11.5px;color:var(--warn,#8f6100);text-align:center}
.aic-meta{margin-top:6px;font-size:11px;color:var(--muted,#5b7085)}
.aic-fc{margin:4px 0 10px;padding:10px;border:1px solid var(--line,#e0e8f0);border-radius:12px;background:var(--tint,#f4f8fc)}
.aic-fc .t{font-size:12px;font-weight:700;color:var(--navy,#073b63);margin-bottom:6px}
.aic-fc .k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:6px}
.aic-fc .k div{padding:7px 9px;border-radius:9px;background:var(--card,#fff);border:1px solid var(--line,#e0e8f0);min-width:0}
.aic-fc .k small{display:block;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted,#5b7085);font-weight:700}
.aic-fc .k b{display:block;font-size:16px;color:var(--navy,#073b63)}.aic-fc .k b.w{color:var(--warn,#8f6100)}.aic-fc .k b.ok{color:var(--ok,#16875d)}
.aic-fc .k em{display:block;font-style:normal;font-size:10.8px;color:var(--muted,#5b7085)}
.aic-fc svg{width:100%;height:auto;display:block}
.aic-fc .g{stroke:var(--line,#e0e8f0);stroke-width:1}.aic-fc .tx{font-size:9.5px;fill:var(--muted,#5b7085)}.aic-fc .tb{font-size:9.5px;font-weight:700;fill:var(--navy,#073b63)}
.aic-fc .pl{fill:none;stroke:#9cc4e4;stroke-width:2}.aic-fc .ac{fill:none;stroke:var(--pri-ink,var(--pri,#0f5fa8));stroke-width:2.6}.aic-fc .fcl{fill:none;stroke:#d97706;stroke-width:2.3;stroke-dasharray:5 4}
.aic-fc .band{fill:rgba(217,119,6,.15)}.aic-fc .now{stroke:var(--muted,#5b7085);stroke-dasharray:2 3}
.aic-lg{display:flex;flex-wrap:wrap;gap:10px;font-size:10.8px;color:var(--muted,#5b7085)}.aic-lg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.aic-typing{display:flex;gap:4px;padding:4px 2px}.aic-typing i{width:7px;height:7px;border-radius:50%;background:#8fb5d6;animation:aicb 1s infinite}.aic-typing i:nth-child(2){animation-delay:.15s}.aic-typing i:nth-child(3){animation-delay:.3s}
@keyframes aicb{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.aic-in{flex:none;padding:10px 14px 6px;border-top:1px solid var(--line,#e0e8f0)}
.aic-box{display:flex;align-items:flex-end;gap:4px;padding:5px 5px 5px 12px;border:1px solid var(--line,#e0e8f0);border-radius:14px;background:var(--tint,#f4f8fc)}
.aic-box:focus-within{border-color:var(--pri2,#087fc1);box-shadow:0 0 0 3px rgba(8,127,193,.14)}
.aic-box textarea{flex:1;min-width:0;min-height:34px;max-height:130px;padding:7px 0;border:0;background:transparent;color:var(--ink,#132b43);font:13.5px/1.45 Inter,system-ui,sans-serif;resize:none;outline:none}
.aic-box button{width:34px;height:34px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:10px;cursor:pointer}
.aic-box button svg{width:18px;height:18px}
.aic-box .aic-mic{background:transparent;color:var(--muted,#5b7085)}
.aic-box .aic-mic:hover,.aic-box .aic-mic[aria-pressed=true]{background:var(--soft,#e8f3fb);color:var(--pri-ink,var(--pri,#0f5fa8))}
.aic-box .aic-send{background:var(--pri,#0f5fa8);color:#fff}
.aic-box button:disabled{opacity:.5;cursor:default}
.aic-dis{display:flex;justify-content:space-between;gap:10px;padding:2px 16px 10px;font-size:10.8px;line-height:1.4;color:var(--muted,#5b7085);flex:none}
.aic-dis .aic-use{flex:none;font-variant-numeric:tabular-nums}
.aic-sheet{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;background:var(--card,#fff);overflow:auto}
.aic-sheet[hidden]{display:none}
.aic-sheet-h{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 16px;border-bottom:1px solid var(--line,#e0e8f0)}
.aic-sheet-h b{font-size:14px;color:var(--navy,#073b63)}
.aic-sec{padding:14px 16px;border-bottom:1px solid var(--line,#e0e8f0)}
.aic-sec h5{margin:0 0 10px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted,#5b7085)}
.aic-field{display:grid;grid-template-columns:84px 1fr auto;gap:8px 10px;align-items:center;font-size:12.5px;color:var(--ink,#132b43)}
.aic-field>span{color:var(--muted,#5b7085)}
.aic-field select{grid-column:2/4;width:100%;min-width:0;min-height:34px;padding:5px 8px;border:1px solid var(--line,#e0e8f0);border-radius:8px;background:var(--card,#fff);color:var(--ink,#132b43);font:inherit}
.aic-field input[type=range]{width:100%;accent-color:var(--pri,#0f5fa8)}
.aic-field output{min-width:42px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted,#5b7085)}
.aic-seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--tint,#f4f8fc);border:1px solid var(--line,#e0e8f0)}
.aic-seg button{min-width:72px;padding:6px 14px;border:0;border-radius:7px;background:transparent;color:var(--muted,#5b7085);font-size:12.5px;font-weight:600;cursor:pointer}
.aic-seg button[aria-pressed=true]{background:var(--card,#fff);color:var(--pri-ink,var(--pri,#0f5fa8));box-shadow:0 1px 3px rgba(5,30,60,.14)}
.aic-row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.aic-btn{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:7px 14px;border:1px solid var(--line,#e0e8f0);border-radius:10px;background:var(--card,#fff);color:var(--pri-ink,var(--pri,#0f5fa8));font-size:12.5px;font-weight:600;cursor:pointer}
.aic-btn svg{width:16px;height:16px}
.aic-btn.pri{border-color:transparent;background:var(--pri,#0f5fa8);color:#fff}
.aic-btn:hover{filter:brightness(.97)}.aic-btn:disabled{opacity:.5;cursor:not-allowed}
.aic-btn[hidden]{display:none}
.aic-note{margin:10px 0 0;font-size:11.5px;line-height:1.5;color:var(--muted,#5b7085)}
.aic-note.tip{padding:8px 10px;border-radius:8px;background:var(--tint,#f4f8fc)}
.aic-note[hidden]{display:none}
.aic-talk-status{margin-top:10px;font-size:12px;line-height:1.45;color:var(--ink,#132b43)}
@media (max-width:640px){.aic{width:100%;border-left:0}.aic-fab{right:10px;bottom:calc(146px + env(safe-area-inset-bottom,0px))}.aic-h{padding-top:calc(10px + env(safe-area-inset-top,0px))}.aic-dis{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}.aic-b{padding:14px 12px 8px}.aic-row>.aic-av{display:none}.aic-q{max-width:92%}}
</style>

    t=t.replace(new RegExp('Rp\\s?('+NUM+')\\s?(T|M|Jt|jt|Rb|rb)\\b','g'),function(m,n,u){return n+' '+({T:'triliun',M:'miliar',Jt:'juta',jt:'juta',Rb:'ribu',rb:'ribu'})[u]+' rupiah'});
    t=t.replace(new RegExp('Rp\\s?('+NUM+')','g'),'$1 rupiah');
    t=t.replace(new RegExp('('+NUM+')\\s?(M|T)\\b','g'),function(m,n,u){return n+(u==='M'?' miliar':' triliun')});
    t=t.replace(new RegExp('[−–-]\\s?('+NUM+')\\s?%','g'),'minus $1 persen').replace(new RegExp('\\+\\s?('+NUM+')','g'),'plus $1').replace(/%/g,' persen');
    t=t.replace(new RegExp('('+NUM+')\\s?[–-]\\s?('+NUM+')','g'),'$1 sampai $2');
    t=t.replace(/(\d)\s?[xX×]\s?(\d)/g,'$1 kali $2');
    var R=[[/\bs\.?\s?d\.?(?=\s|$)/gi,'sampai dengan'],[/\bvs\.?\b/gi,'dibanding'],[/→|⇒|->/g,' menjadi '],[/←/g,' dari '],[/≥/g,' minimal '],[/≤/g,' maksimal '],[/±/g,' kurang lebih '],[/&/g,' dan '],[/·|•/g,', '],[/\bdll\b\.?/gi,'dan lain-lain'],[/\bdsb\b\.?/gi,'dan sebagainya'],[/\byg\b/gi,'yang'],[/\btgl\b\.?/gi,'tanggal'],[/\bthn\b\.?/gi,'tahun'],[/\bmg\b/g,'minggu'],[/\bhr\b/g,'hari'],[/\bQ([1-4])\b/g,'kuartal $1'],[/\bYTD\b/g,'sampai saat ini'],[/\bAt risk\b/gi,'berisiko'],[/\bOn track\b/gi,'sesuai jadwal'],[/\//g,' atau ']];
    R.forEach(function(r){t=t.replace(r[0],r[1])});
    t=t.replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu,'').replace(/\(\s*\)/g,'').replace(/\s+([.,;:!?])/g,'$1').replace(/([.,;:!?]){2,}/g,'$1').replace(/\s+/g,' ').trim();
    if(index>=0&&styleOf().style==='santai'&&t){
      var op=['Oke, ini ringkasannya.','Baik, begini hasilnya.','Siap, ini yang saya temukan.'],cl=['Itu dulu ya. Kalau perlu detail per proyek, tinggal tanya.','Begitu kira-kira. Ada yang mau dicek lagi?','Segitu dulu. Mau saya jelaskan bagian tertentu?'];
      var k=(index+t.length)%3;t=op[k]+' '+t+' '+cl[k];
    }
    return t;
  }
  function chunksOf(t){var parts=t.split(/(?<=[.!?;:])\s+/),out=[],cur='';
    parts.forEach(function(p){p=p.trim();if(!p)return;
      while(p.length>240){var c=p.lastIndexOf(',',220);if(c<80)c=p.lastIndexOf(' ',220);if(c<80)c=220;if(cur){out.push(cur);cur=''}out.push(p.slice(0,c+1).trim());p=p.slice(c+1).trim()}
      if((cur+' '+p).length>200&&cur){out.push(cur);cur=p}else cur=cur?cur+' '+p:p});
    if(cur)out.push(cur);return out}
  function updateVoiceChoices(){
    if(!pan)return;
    var select=pan.querySelector('#aicVoiceSelect'), label=pan.querySelector('#aicVoiceLbl');
    if(!select || !label)return;
    var voices=indonesianVoices(),saved='';try{saved=localStorage.getItem('pmoAiVoice_'+AVSEL)||''}catch(e){}
    label.textContent='Suara';
    select.replaceChildren(new Option(voices.length?'Pilih suara Bahasa Indonesia':'Suara Bahasa Indonesia tidak tersedia',''));
    voices=rankVoices(voices);
    voices.forEach(function(v){select.add(new Option(v.name.replace(/\s*-\s*Indonesian.*$/i,'')+(isNatural(v)?' (alami)':'')+' · '+v.lang,voiceId(v)))});
    if(!voices.some(function(v){return voiceId(v)===saved})&&voices.length)saved=voiceId(voices[0]);
    select.value=voices.some(function(v){return voiceId(v)===saved})?saved:'';
    var tip=pan.querySelector('.aic-voice-tip');if(tip){var nat=voices.some(isNatural);tip.hidden=!voices.length||nat;tip.textContent='Suara di browser ini masih standar. Untuk suara yang lebih natural, buka dashboard di Microsoft Edge lalu pilih suara bertanda (alami).'}
    paintStyle();
    select.disabled=!voices.length;
    pan.querySelector('[data-a=voice-test]').disabled=!voices.length;
  }
  function selectVoice(){
    var voices=indonesianVoices(), selected=pan.querySelector('#aicVoiceSelect').value;
    if(!voices.length){speechNote='Suara Bahasa Indonesia belum tersedia di browser ini.';refreshSpeechButtons();return null}
    var voice=voices.find(function(v){return voiceId(v)===selected});
    if(!voice){speechNote='Pilih suara '+assistantName()+' di Pengaturan suara, lalu coba suaranya.';toggleSheet(true);refreshSpeechButtons();return null}
    return voice;
  }
  function speakAnswer(index){
    if(!voiceSupported())return;
    if(speechIndex===index){stopSpeech();return}
    var msg=ST.msgs[index];if(!msg || msg.role!=='ai' || msg.error)return;
    playVoiceText(String(msg.text||''),index);
  }
  function playVoiceText(input,index){
    if(!voiceSupported())return;
    if(speechIndex===index){stopSpeech();return}
    stopSpeech();var voice=selectVoice();if(!voice)return;
    var text=spoken(input,index);
    if(!text)return;
    var chunks=chunksOf(text),st=styleOf(),gap=(VPRE[st.style]||VPRE.santai).gap;
    speechIndex=index;speechNote='';var run=++speechRun;refreshSpeechButtons();
    function next(){
      if(run!==speechRun)return;
      if(!chunks.length){speechIndex=-1;refreshSpeechButtons();if(sayDone){var f=sayDone;sayDone=null;f()}return}
      var utterance=new SpeechSynthesisUtterance(chunks.shift());utterance.lang=voice.lang||'id-ID';utterance.voice=voice;utterance.rate=Math.max(0.5,Math.min(2,Number(st.rate)||1));utterance.pitch=Math.max(0.5,Math.min(2,Number(st.pitch)||1));
      utterance.onend=function(){if(run!==speechRun)return;setTimeout(next,gap)};utterance.onerror=function(){if(run!==speechRun)return;speechIndex=-1;speechNote='Suara tidak dapat diputar. Periksa pengaturan suara browser.';refreshSpeechButtons()};
      window.speechSynthesis.speak(utterance);
    }
    try{next()}catch(e){speechIndex=-1;speechNote='Suara tidak dapat diputar di browser ini.';refreshSpeechButtons()}
  }
  function render(){
    pan.querySelector('.aic-sub').textContent=ctxText()||'Portofolio proyek';
    var name=assistantName(),h='';
    if(!ST.msgs.length){
      h+='<div class="aic-hi"><img alt="" src="'+av()+'"><div><b>Halo, saya '+name+'.</b><span>Saya membaca data dashboard yang boleh Anda akses: progres, forecast, keuangan, dokumen, dan pekerjaan di semua proyek.</span>'+(ST.status&&!ST.status.configured?'<span class="warn">AI belum dikonfigurasi (ANTHROPIC_API_KEY kosong).</span>':'')+'</div></div>';
      h+='<div class="aic-sug"><p>Coba tanyakan</p>'+chips().map(function(c){return '<button type="button" data-sug>'+IC.arrow+'<span>'+esc(c)+'</span></button>'}).join('')+'</div>';
    }
    ST.msgs.forEach(function(m,index){
      if(m.role==='user'){h+='<div class="aic-q">'+esc(m.text)+'</div>';return}
      if(m.error){h+='<div class="aic-row"><i class="aic-av" aria-hidden="true"></i><div class="aic-a"><p class="aic-err">'+esc(m.text)+'</p></div></div>';return}
      var det=[];if(m.steps&&m.steps.length)det.push('Data yang dibaca: '+esc(m.steps.join(' · ')));if(m.meta)det.push(esc(m.meta));
      h+='<div class="aic-row"><i class="aic-av" aria-hidden="true"></i><div class="aic-a">'+(m.cards||[]).map(card).join('')+md(m.text)+
        '<div class="aic-af"><button type="button" class="aic-act" data-speech-index="'+index+'"></button>'+
        '<span class="src">'+(m.sources&&m.sources.length?'Sumber: '+esc(m.sources.join(', ')):'')+'</span>'+
        (det.length?'<details class="aic-det"><summary>'+IC.info.replace('<svg ','<svg width="13" height="13" ')+'Detail</summary><div>'+det.join('<br>')+'</div></details>':'')+'</div></div></div>'});
    if(ST.busy)h+='<div class="aic-row"><i class="aic-av" aria-hidden="true"></i><div class="aic-a"><div class="aic-typing"><i></i><i></i><i></i></div><div class="aic-meta">'+name+' sedang membaca data dashboard… (10–30 detik)</div></div></div>';
    body.innerHTML=h+'<div class="aic-voice-note" role="status" hidden></div>';
    body.querySelectorAll('[data-sug]').forEach(function(b){b.onclick=function(){send(b.textContent)}});
    body.querySelectorAll('[data-speech-index]').forEach(function(b){b.onclick=function(){speakAnswer(Number(b.getAttribute('data-speech-index')))}});
    refreshSpeechButtons();body.scrollTop=body.scrollHeight;
    sendB.disabled=ST.busy;paintConversation();
    var s=ST.status;usageEl.textContent=s&&s.limit?(s.used||0)+'/'+s.limit+' pertanyaan hari ini':'';
  }
  /* externalDone: dipanggil oleh jembatan suara; tanpa itu pertanyaan berasal dari kotak ketik. */
  function send(text,externalDone){
    text=String(text||'').trim();if(!text||ST.busy)return;
    var hist=[];for(var i=0;i<ST.msgs.length-1;i++){var a=ST.msgs[i],b=ST.msgs[i+1];if(a.role==='user'&&b.role==='ai'&&!b.error){hist.push({q:a.text,a:b.text});i++}}
    ST.msgs.push({role:'user',text:text});if(!externalDone){ta.value='';ta.style.height='auto'}ST.busy=true;toggleSheet(false);render();
    var req=ctx();req.avatar=AVSEL;req.question=text;req.history=hist.slice(-4);
    google.script.run.withSuccessHandler(function(r){ST.busy=false;
        var u=r.usage||{};if(ST.status){ST.status.used=u.used;ST.status.limit=u.limit}
        ST.msgs.push({role:'ai',text:r.answer,cards:r.cards||[],sources:r.sources||[],steps:r.steps||[],meta:(r.model||'')+(u.input?' · '+u.input+' / '+u.output+' token':'')+(u.usd!=null?' · ± $'+u.usd:'')});save();render();
        if(externalDone)externalDone({answer:r.answer,usage:u,hasCards:!!(r.cards&&r.cards.length)})})
      .withFailureHandler(function(e){ST.busy=false;var error=(e&&e.message)?e.message:String(e);ST.msgs.push({role:'ai',error:true,text:error});save();render();if(externalDone)externalDone({error:error})})
      .askAssistant(tok(),req);
  }

  /* ===== Jembatan percakapan suara =====
     Mikrofon tidak diizinkan di dalam bingkai Google Apps Script, jadi percakapan berjalan di jendela terpisah.
     Hanya origin VOICE_ORIGIN + jendela yang dibuka dari sini + kanal acak yang diterima. Token sesi dan kunci API
     tidak pernah dikirim; setiap pertanyaan tetap lewat askAssistant dengan kuota harian akun yang sama. */
  var CV={mode:false,rec:null};
  var VOICE_ORIGIN='https://sena-pmo-percakapan.flaredholly.chatgpt.site';
  var VOICE_PROTOCOL='sena-voice-v1';
  var VB={win:null,channel:'',ready:false,lastId:0,pending:false,started:0,timer:null,note:''};
  function talkStatus(text){VB.note=text||'';if(!pan)return;pan.querySelector('.aic-talk-status').textContent=VB.note;pan.querySelector('.aic-vtext').textContent=VB.note}
  function paintConversation(){if(!pan)return;var on=!!VB.win,bar=pan.querySelector('.aic-vbar');
    bar.hidden=!on;bar.classList.toggle('on',VB.ready);
    pan.querySelector('[data-a=voice] .dot').hidden=!VB.ready;
    pan.querySelector('[data-a=voice]').setAttribute('aria-pressed',String(on));pan.querySelector('[data-a=mic]').setAttribute('aria-pressed',String(on));
    pan.querySelector('.aic-sheet [data-a=external-conversation] span').textContent=on?'Tampilkan jendela percakapan':'Buka jendela percakapan';
    pan.querySelector('.aic-sheet [data-a=external-disconnect]').hidden=!on}
  function bridgePost(type,data){if(!VB.win||!VB.channel)return;try{VB.win.postMessage(Object.assign({protocol:VOICE_PROTOCOL,channel:VB.channel,type:type},data||{}),VOICE_ORIGIN)}catch(e){}}
  function stopConversation(note){if(VB.win)bridgePost('disconnect',{reason:note||'Sambungan dihentikan dari dashboard. Buka kembali melalui widget '+assistantName()+'.'});VB.win=null;VB.channel='';VB.ready=false;VB.pending=false;VB.lastId=0;clearInterval(VB.timer);talkStatus(note||'');paintConversation()}
  function bridgeConfig(){var st=styleOf(),voice='';try{voice=pan.querySelector('#aicVoiceSelect').value||''}catch(e){}
    return {name:assistantName(),avatar:AVSEL,context:ctxText(),voiceId:voice,rate:st.rate,pitch:st.pitch,usage:ST.status?{used:ST.status.used||0,limit:ST.status.limit}:null}}
  function openExternalConversation(){
    stopSpeech();
    if(VB.win){try{if(!VB.win.closed){VB.win.focus();return}}catch(e){}stopConversation()}
    if(!window.crypto||!window.crypto.getRandomValues){talkStatus('Browser belum mendukung sambungan aman. Gunakan Chrome atau Edge terbaru.');toggleSheet(true);return}
    var bytes=new Uint8Array(24);window.crypto.getRandomValues(bytes);VB.channel=Array.from(bytes).map(function(b){return b.toString(16).padStart(2,'0')}).join('');VB.started=Date.now();VB.lastId=0;VB.pending=false;VB.ready=false;
    var url=VOICE_ORIGIN+'/?layout=popup&v=3#parent='+encodeURIComponent(window.location.origin)+'&channel='+VB.channel;
    var sw=(window.screen&&window.screen.availWidth)||1024,sh=(window.screen&&window.screen.availHeight)||768;
    var pw=Math.min(400,sw),ph=Math.min(620,sh),px=Math.max(0,sw-pw-40),py=Math.max(0,Math.round((sh-ph)/2));
    try{VB.win=window.open(url,'_blank','popup=yes,width='+pw+',height='+ph+',left='+px+',top='+py+',resizable=yes,scrollbars=yes')}catch(e){VB.win=null}
    if(!VB.win){VB.channel='';talkStatus('Jendela percakapan diblokir. Izinkan pop-up untuk dashboard ini, lalu coba lagi.');toggleSheet(true);paintConversation();return}
    talkStatus('Menghubungkan jendela percakapan…');paintConversation();
    VB.timer=setInterval(function(){try{if(VB.win&&VB.win.closed){stopConversation('Jendela percakapan ditutup.');return}}catch(e){}
      if(Date.now()-VB.started>2*60*60*1000){stopConversation('Sambungan suara berakhir. Buka kembali untuk melanjutkan.');return}
      if(!VB.ready&&Date.now()-VB.started>40000)talkStatus('Belum terhubung. Selesaikan masuk/izin di jendela percakapan, atau tutup lalu buka kembali.');
    },5000);
  }
  function onVoiceMessage(e){
    var d=e.data;if(e.origin!==VOICE_ORIGIN||e.source!==VB.win||!VB.channel||!d||d.protocol!==VOICE_PROTOCOL||d.channel!==VB.channel)return;
    if(Date.now()-VB.started>2*60*60*1000){stopConversation('Sambungan suara berakhir. Buka kembali dari widget.');return}
    if(d.type==='hello'){VB.ready=true;bridgePost('ready',{config:bridgeConfig()});talkStatus('Percakapan suara terhubung.');paintConversation();return}
    if(d.type==='ping'){bridgePost('pong');return}
    if(d.type==='bye'){stopConversation('Jendela percakapan ditutup.');return}
    if(d.type!=='ask'||!VB.ready)return;
    var id=String(d.id||''),prefix=VB.channel.slice(0,10)+'-';if(id.indexOf(prefix)!==0)return;var seq=Number(id.slice(prefix.length));
    if(!Number.isSafeInteger(seq)||seq<=VB.lastId)return;VB.lastId=seq;
    var text=typeof d.text==='string'?d.text.trim():'';
    if(!text||text.length>2000){bridgePost('result',{id:id,error:'Pertanyaan harus berisi 1–2.000 karakter.'});return}
    if(/^oke\s*terima\s*kasih[.!?,\s]*$/i.test(text)){bridgePost('result',{id:id,error:'Percakapan selesai. Terima kasih.'});return}
    if(ST.busy||VB.pending){bridgePost('result',{id:id,error:assistantName()+' masih memproses pertanyaan sebelumnya.'});return}
    VB.pending=true;var channel=VB.channel,win=VB.win;
    if(!ST.open)open({detail:1});
    talkStatus('Pertanyaan suara diterima · '+assistantName()+' sedang menjawab…');
    send(text,function(result){if(VB.channel!==channel||VB.win!==win)return;VB.pending=false;bridgePost('result',Object.assign({id:id},result));talkStatus('Percakapan suara terhubung.')});
  }
  function initConversation(){
    pan.querySelector('.aic-sheet [data-a=external-conversation]').onclick=openExternalConversation;
    pan.querySelectorAll('[data-a=external-disconnect]').forEach(function(b){b.onclick=function(){stopConversation('');stopSpeech()}});
    pan.querySelector('[data-a=voice-focus]').onclick=openExternalConversation;
    pan.querySelector('[data-a=voice]').onclick=openExternalConversation;
    pan.querySelector('[data-a=mic]').onclick=openExternalConversation;
    window.addEventListener('message',onVoiceMessage);
    window.addEventListener('pagehide',function(){stopConversation('Dashboard ditutup atau dimuat ulang.')});
    paintConversation();
  }
  function init(){
    if(!PAGE||typeof google==='undefined'||!google.script)return;
    var t=tok();if(!t)return;
    google.script.run.withSuccessHandler(function(s){if(!s||!s.enabled)return;ST.status=s;build()}).withFailureHandler(function(){}).getAiStatus(t);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(init,600)});else setTimeout(init,600);
})();
</script>
