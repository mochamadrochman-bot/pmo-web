/* sidebar (sama dengan Weekly) */
.app{display:grid;grid-template-columns:var(--sw,268px) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s ease}
.main{min-width:0}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;overflow:hidden}
.side-head{display:flex;align-items:center;gap:10px;padding:16px 14px 12px 18px;min-height:76px}

.sbtn{width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}.sbtn:hover{background:var(--soft);color:var(--pri-ink)}

.side-foot{padding:12px 14px 16px;border-top:1px solid var(--line)}

}

function paint(root){(root||document).querySelectorAll('[data-ic]').forEach(function(el){const p=P[el.getAttribute('data-ic')];if(p)el.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'})}

function $(id){return document.getElementById(id)}

function goProj(page){window.top.location.href=appUrl+'?page='+page+(D&&D.project?'&project='+encodeURIComponent(D.project.name):'')}
function toast(msg){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(window.__tt);window.__tt=setTimeout(function(){t.hidden=true},4200)}
function toggleTheme(){const dark=document.documentElement.getAttribute('data-theme')!=='dark';document.documentElement.setAttribute('data-theme',dark?'dark':'light');try{localStorage.setItem('pmoExecutiveTheme',dark?'dark':'light')}catch(e){}themeIcon()}
function themeIcon(){$('themeBtn').firstElementChild.setAttribute('data-ic',document.documentElement.getAttribute('data-theme')==='dark'?'sun':'moon');paint($('themeBtn'))}
function sessionExpired_(msg){if(!/sesi (login )?(tidak valid|tidak ditemukan|telah berakhir|berakhir)|silakan login kembali/i.test(String(msg||'')))return false;goLogin_();return true}
function goLogin_(){if(window.__goingLogin)return;window.__goingLogin=true;try{sessionStorage.removeItem('pmoSessionToken');sessionStorage.removeItem('pmoUser')}catch(e){}window.top.location.href=appUrl}
function showError(msg){if(sessionExpired_(msg))return;const e=$('error');e.hidden=false;e.textContent=msg;$('loading').hidden=true}
function busy(on,txt){$('busy').hidden=!on;if(txt)$('busyText').textContent=txt}
function run(fn,args,ok,fail,txt){busy(true,txt||'Memproses…');const r=google.script.run.withSuccessHandler(function(v){busy(false);ok(v)}).withFailureHandler(function(e){busy(false);const m=e&&e.message?e.message:String(e);if(fail)fail(m);if(!sessionExpired_(m))toast(m)});r[fn].apply(r,args)}
function call(fn,args){return new Promise(function(res,rej){const r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(new Error(e&&e.message?e.message:String(e)))});r[fn].apply(r,args)})}
function askConfirm(o,cb){const m=$('askModal');$('askTitle').textContent=o.title;$('askText').textContent=o.text;$('askOk').textContent=o.ok||'Lanjutkan';m.hidden=false;setTimeout(function(){$('askCancel').focus()},30);const done=function(v){m.hidden=true;$('askOk').onclick=$('askCancel').onclick=m.onclick=null;if(v)cb()};$('askOk').onclick=function(){done(true)};$('askCancel').onclick=function(){done(false)};m.onclick=function(e){if(e.target===m)done(false)}}
const MONL=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'],MONS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function nf(v,d){if(v==null||!isFinite(v))return '–';return Number(v).toLocaleString('id-ID',{minimumFractionDigits:d==null?0:d,maximumFractionDigits:d==null?0:d})}
function pc(v,d){return v==null||!isFinite(v)?'–':nf(v,d==null?2:d)}
function sg(v,d){if(v==null||!isFinite(v))return '–';return (v>0?'+':'')+nf(v,d==null?2:d)}
function iso2d(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function setDirty(v){dirty=!!v;$('gbar').hidden=!dirty}
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue=''}});

/* ---------- nilai efektif: catatan (suntingan) atau data otomatis ---------- */
/* narasi slide keuangan: kalimat pembuka & catatan (otomatis dari angka Laporan Bulanan) */
function finAuto(){const F=D.auto.finance,T=F.total,mon=F.monthName||'',yr=F.year,nm=(typeof MRPPT!=='undefined'&&MRPPT.projTitle)?MRPPT.projTitle(D):D.project.name;
  const rp=function(j){return j==null||!isFinite(j)?'-':'Rp. '+Math.round(j*1e6).toLocaleString('id-ID')},pp=function(x){return x==null||!isFinite(x)?'-':(x*100).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'};
  const intro='Sampai dengan Bulan '+mon+' '+yr+' realisasi anggaran proyek '+nm+' sebagai berikut :';
  const note=T.ytd==null&&T.pos==null?'Realisasi biaya bulan '+mon+' '+yr+' belum diisi di Laporan Bulanan.':

  return {intro:intro,note:note}}
function V(){const A=D.auto,n=N||{};

/* ---------- init ---------- */
function init(){if(!token){goLogin_();return}run('getMgmtReportList',[token],function(l){LIST=l;
  const u=l.user||{},nm=u.name||u.username||'Pengguna';$('userAv').textContent=nm.trim().split(/\s+/).slice(0,2).map(function(p){return p.charAt(0)}).join('').toUpperCase();
  if(!l.projects.length){if(l.setup&&l.setup.canSetup&&window.pmoSetupNotice&&pmoSetupNotice(l.setup,'report'))return;showError('Pelaporan manajemen hanya untuk ADMIN dan tim input proyek. Akun Anda belum terdaftar sebagai tim input proyek mana pun.');return}
  const want=String(initialProjectName||'').toUpperCase();
  const p=l.projects.find(function(x){return x.id===want||x.name.toUpperCase()===want})||l.projects[0];
  $('projSel').innerHTML=l.projects.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===p.id?' selected':'')+'>'+esc(x.name)+'</option>'}).join('');

function fillMonths(p,key){$('monSel').innerHTML=p.months.slice().reverse().map(function(m){const off=m.ready===false&&m.key!==key;return '<option value="'+m.key+'"'+(m.key===key?' selected':'')+(off?' disabled':'')+'>'+esc(m.label)+(m.ready===false?' — cut-off W'+m.needWeek+', input baru s.d. W'+p.lastWeek:'')+'</option>'}).join('')}
function guard(cb){if(!dirty){cb();return}askConfirm({title:'Perubahan belum disimpan',text:'Isian yang sudah disunting akan hilang bila pindah proyek/bulan. Lanjutkan?',ok:'Pindah tanpa simpan'},function(){setDirty(false);cb()})}
$('projSel').onchange=function(){const id=this.value,p=LIST.projects.find(function(x){return x.id===id});guard(function(){fillMonths(p,p.def);load(p.id,p.def)})};

function load(pid,key){mrGalleryClose_(true);run('getMgmtReport',[token,pid,key],function(d){D=d;N=clone(d.notes)||{};PH={};setDirty(false);

function stLine(){const A=D.auto,s=[];
  s.push('<span>Periode <b>'+esc(D.periodLabel)+'</b> · M'+A.monthNo+(A.monthTotal?' dari M'+A.monthTotal:'')+' · cut-off <b>W'+A.weekOfMonth+'</b>'+(A.week<A.weekOfMonth?' (input mingguan baru s.d. W'+A.week+')':'')+'</span>');
  const ew=A.epcWeek||{},ek=Object.keys(ew).filter(function(k){return ew[k]});if(ek.length)s.push('<span>EPCC Control: '+ek.map(function(k){return k+' W'+ew[k]}).join(' · ')+'</span>');
  if(A.finance&&A.finance.basis)s.push('<span class="wrn">Keuangan berdasarkan laporan bulan '+esc(A.finance.basis.label)+'</span>');
  s.push(D.saved?'<span>Isian disimpan '+esc(D.saved.by)+' · '+esc(D.saved.at)+'</span>':'<span>Belum ada isian tersimpan · semua dari data otomatis</span>');
  if(D.archive)s.push('<span>Arsip: <a href="'+esc(D.archive.url)+'" target="_blank" rel="noopener">'+esc(D.archive.name)+'</a> ('+esc(D.archive.at)+')</span>');
  if(!D.drive)s.push('<span class="wrn">Folder Drive tim belum diatur: foto tidak tersimpan & arsip tidak tersedia</span>');

  function gantt(pres,s,A,D){
    const x0=7.6,y0=0.98,lw=1.05,sw=0.3,gx=x0+lw+sw,gw=13.0-gx,rh=0.205;
    s.addText('Timeline',{x:x0,y:y0-0.02,w:0.9,h:0.24,fontFace:FONT,fontSize:12,bold:true,color:NAVY,margin:0,isTextBox:true});
    [[GREY,'Plan'],[ACT,'Actual'],[FC,'Forecast']].forEach(function(l,i){const lx=x0+1.0+i*0.85;s.addShape(pres.shapes.RECTANGLE,{x:lx,y:y0+0.04,w:0.2,h:0.14,fill:{color:l[0]},line:{color:l[0],width:0}});s.addText(l[1],{x:lx+0.24,y:y0,w:0.6,h:0.22,fontFace:FONT,fontSize:8.5,color:INK,margin:0,isTextBox:true})});
    const T=A.timeline.filter(function(t){return !t.none});
    const dates=[];T.forEach(function(t){[t.plan,t.actual,t.forecast].forEach(function(r){if(r){dates.push(iso2d(r[0]));dates.push(iso2d(r[1]))}})});
    const st=iso2d(A.startIso);dates.push(st);
    let mn=new Date(Math.min.apply(null,dates)),mx=new Date(Math.max.apply(null,dates));
    const q0=new Date(mn.getFullYear(),Math.floor(mn.getMonth()/3)*3,1),q1=new Date(mx.getFullYear(),Math.floor(mx.getMonth()/3)*3+3,1);
    const qs=[];for(let d=new Date(q0);d<q1;d=new Date(d.getFullYear(),d.getMonth()+3,1))qs.push(new Date(d));
    const qw=gw/qs.length,X=function(d){return gx+gw*(d-q0)/(q1-q0)};
    const ty=y0+0.3,line={color:'7F7F7F',width:0.5};
    // header: tahun & kuartal
    s.addShape(pres.shapes.RECTANGLE,{x:x0,y:ty,w:lw+sw,h:rh*2,fill:{color:'FFFFFF'},line:line});
    s.addText('Phase',{x:x0,y:ty,w:lw+sw,h:rh*2,fontFace:FONT,fontSize:9,bold:true,color:'000000',align:'center',valign:'middle',margin:0,isTextBox:true});
    let yi=0;while(yi<qs.length){const y=qs[yi].getFullYear();let n=0;while(yi+n<qs.length&&qs[yi+n].getFullYear()===y)n++;
      s.addShape(pres.shapes.RECTANGLE,{x:gx+yi*qw,y:ty,w:n*qw,h:rh,fill:{color:'FFFFFF'},line:line});s.addText(n>=2||qs.length<6?String(y):String(y).slice(2),{x:gx+yi*qw,y:ty,w:n*qw,h:rh,fontFace:FONT,fontSize:8,color:'000000',align:'center',valign:'middle',margin:0,isTextBox:true});yi+=n}
    qs.forEach(function(q,i){s.addShape(pres.shapes.RECTANGLE,{x:gx+i*qw,y:ty+rh,w:qw,h:rh,fill:{color:'FFFFFF'},line:line});s.addText('Q'+(Math.floor(q.getMonth()/3)+1),{x:gx+i*qw,y:ty+rh,w:qw,h:rh,fontFace:FONT,fontSize:qw<0.3?6.5:8,color:'000000',align:'center',valign:'middle',margin:0,isTextBox:true})});
    const by=ty+rh*2,fm=function(iso){const d=iso2d(iso);return d?MONL[d.getMonth()]+' '+d.getFullYear():''};
    A.timeline.forEach(function(t,i){const y=by+i*rh*2.25;
      s.addShape(pres.shapes.RECTANGLE,{x:x0,y:y,w:lw,h:rh*2.25,fill:{color:'FFFFFF'},line:line});
      s.addText(t.name,{x:x0,y:y,w:lw,h:rh*2.25,fontFace:FONT,fontSize:8.5,bold:true,color:'000000',valign:'middle',margin:[0,3,0,3],isTextBox:true,fit:'shrink'});
      ['P','A/F'].forEach(function(k,j){const yy=y+j*rh*1.125;s.addShape(pres.shapes.RECTANGLE,{x:x0+lw,y:yy,w:sw,h:rh*1.125,fill:{color:'FFFFFF'},line:line});s.addText(k,{x:x0+lw,y:yy,w:sw,h:rh*1.125,fontFace:FONT,fontSize:7,color:'000000',align:'center',valign:'middle',margin:0,isTextBox:true})});
      qs.forEach(function(q,qi){s.addShape(pres.shapes.RECTANGLE,{x:gx+qi*qw,y:y,w:qw,h:rh*2.25,fill:{color:'FFFFFF'},line:{color:'D9D9D9',width:0.5}})});
      const bar=function(r,yy,col){if(!r)return null;const a=X(iso2d(r[0])),b=Math.max(a+0.03,X(iso2d(r[1])));s.addShape(pres.shapes.RECTANGLE,{x:a,y:yy+0.03,w:b-a,h:rh*1.125-0.06,fill:{color:col},line:{color:col,width:0}});return b};

      if(e&&!t.notStarted)lab(fm(t.finish),e,yy);
    });
    // garis periode laporan
    const lx=X(iso2d(A.monthEndIso)),ly1=by+A.timeline.length*rh*2.25;
    s.addShape(pres.shapes.LINE,{x:lx,y:ty+rh,w:0,h:ly1-ty-rh,line:{color:RED,width:1.25,dashType:'dash'}});
  }

(function(){let st={};try{st=JSON.parse(localStorage.getItem('pmoMrSideGrp')||'null')||{}}catch(e){st={}}
  const apply=function(){document.querySelectorAll('[data-sgw]').forEach(function(w){const k=w.getAttribute('data-sgw'),min=!!st[k],t=w.querySelector('[data-sg]');w.classList.toggle('min',min);if(t)t.setAttribute('aria-expanded',String(!min));
    const n=w.querySelectorAll('.nav:not([hidden])').length-w.querySelectorAll('.nav.on:not([hidden]),.nav.active:not([hidden])').length,b=w.querySelector('.sg-n');if(b)b.textContent=min&&n>0?'+'+n:''})};
  document.querySelectorAll('[data-sg]').forEach(function(t){const tg=function(){const k=t.getAttribute('data-sg');st[k]=!st[k];try{localStorage.setItem('pmoMrSideGrp',JSON.stringify(st))}catch(e){}apply()};t.onclick=tg;t.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();tg()}}});
  apply()})();
(function(){const app=$('app'),mq=window.matchMedia('(max-width:900px)'),btns=Array.prototype.slice.call(document.querySelectorAll('[data-toggle-nav]'));
  try{if(localStorage.getItem('pmoWeeklyNav')==='collapsed')app.classList.add('collapsed')}catch(e){}
  const sync=function(){const open=mq.matches?app.classList.contains('nav-open'):!app.classList.contains('collapsed');btns.forEach(function(b){b.setAttribute('aria-expanded',String(open))})};
  btns.forEach(function(b){b.addEventListener('click',function(){if(mq.matches)app.classList.toggle('nav-open');else{const c=app.classList.toggle('collapsed');try{localStorage.setItem('pmoWeeklyNav',c?'collapsed':'open')}catch(e){}}sync()})});
  $('scrim').addEventListener('click',function(){app.classList.remove('nav-open');sync()});
  if(mq.addEventListener)mq.addEventListener('change',function(){app.classList.remove('nav-open');sync()});sync();
  $('pjBtn').onclick=function(){const s=$('projSel');app.classList.remove('nav-open');s.focus();try{s.showPicker()}catch(e){s.click()}};
})();
init();
</script>
