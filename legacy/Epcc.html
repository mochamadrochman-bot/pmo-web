/* sidebar (sama dengan Weekly) */
.app{display:grid;grid-template-columns:var(--sw,268px) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s ease}
.main{min-width:0}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;overflow:hidden}
.side-head{display:flex;align-items:center;gap:10px;padding:16px 14px 12px 18px;min-height:76px}

.sbtn{width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}.sbtn:hover{background:var(--soft);color:var(--pri-ink)}

.side-foot{padding:12px 14px 16px;border-top:1px solid var(--line)}

.scrim{display:none}.hamb{display:none}

.clip[role="button"]{cursor:pointer}.clip[role="button"]:hover{background:var(--pri);color:#fff}
.modal.vw{z-index:85;padding:16px}
.vw-box{grid-template-columns:minmax(0,1fr);width:min(1280px,100%);height:min(900px,calc(100vh - 32px));background:var(--card);border-radius:16px;box-shadow:0 24px 60px rgba(7,20,36,.4);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;border:1px solid var(--line)}

.vw-h{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 18px;border-bottom:1px solid var(--line)}
.vw-h .t{flex:1;min-width:0}.vw-h h2{margin:0;font-size:16px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vw-h small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.vw-it{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-size:13px;line-height:1.3}
.vw-it:hover{background:var(--soft)}.vw-it.on{background:var(--pri);color:#fff}.vw-it.on small{color:rgba(255,255,255,.8)}
.vw-it .ic{width:16px;height:16px;flex:none;margin-top:1px}.vw-it small{display:block;color:var(--muted);font-size:11.5px}
.vw-main{position:relative;min-width:0;min-height:0;background:#525659;display:flex}

.vw-main iframe{flex:1;border:0;width:100%;height:100%;background:#fff}
.vw-pdf{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}

.vw-img{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:16px}.vw-img img{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.vw-state{margin:auto;text-align:center;color:#e8eef5;max-width:420px;padding:24px;font-size:14px}.vw-state b{display:block;font-size:16px;margin-bottom:6px;color:#fff}.vw-state .btn{margin-top:14px}
.vw-spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:vwspin .8s linear infinite;margin:0 auto 12px}
@keyframes vwspin{to{transform:rotate(360deg)}}
.vw-zoom{position:absolute;right:16px;bottom:16px;display:flex;gap:4px;align-items:center;background:rgba(20,30,42,.85);border-radius:12px;padding:4px;color:#fff;font-size:12px;font-variant-numeric:tabular-nums}

.vw-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--pri-ink)}.vw-badge .ic{width:12px;height:12px}.vw-badge.lock{background:var(--warn-bg);color:var(--warn)}

.ar-drv{margin:8px 0 12px}.ar-drv .panel{box-shadow:none;margin-top:6px!important;background:var(--tint)}
.lnkbtn{border:0;background:none;color:var(--pri-ink);font-weight:600;font-size:12px;padding:0 0 0 6px;cursor:pointer;text-decoration:underline}

@media (max-width:1100px){.g2,.g3,.g3e{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

}

/* ===== EPCC Procurement & Construction (pratinjau) ===== */
.tg{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--tint);color:var(--muted);white-space:nowrap}
.tg.ln{background:#efe7fb;border-color:#d8c6f3;color:#6a3fb0}.tg.lk{background:var(--soft);border-color:transparent;color:var(--pri-ink)}
.tg.ll{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}.tg.cr{background:var(--bad);border-color:var(--bad);color:#fff}
.tg.nl{background:var(--tint);color:var(--muted);border-style:dashed}
:root[data-theme="dark"] .tg.ln{background:#2e2447;border-color:#4a3a70;color:#cdb6f5}
.st.ahead{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.st.behind{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.st.on{background:var(--soft);color:var(--pri-ink)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .cd{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap}
.tbl .nm{min-width:240px}.tbl .nm b{font-weight:600;display:block;line-height:1.35}
.tbl tr.grp td{background:var(--tint);font-weight:700;color:var(--navy);font-size:12px;letter-spacing:.02em}
.dupw{color:var(--warn);font-weight:700}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.split>div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--tint)}
.split small{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.split b{font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums}
.split p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.split .dbar{margin-top:8px}
/* timeline long lead */
.tl{position:relative;font-size:12px}
.tl-h,.tl-r{display:grid;grid-template-columns:minmax(180px,250px) minmax(0,1fr);align-items:center}
.tl-h{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line)}
.tl-h .ax{position:relative;height:28px}
.tl-h .ax span{position:absolute;top:6px;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.tl-r{border-bottom:1px dashed var(--line);min-height:46px}
.tl-r .lb{padding:6px 10px 6px 0;min-width:0}.tl-r .lb b{display:block;font-weight:600;font-size:12.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tl-r .lb small{color:var(--muted)}
.tl-r .tr{position:relative;height:46px}
.tl .grid-m{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.tl .now{position:absolute;top:0;bottom:0;border-left:2px solid var(--amb);z-index:1}
.tl .now em{position:absolute;top:-2px;left:4px;font-style:normal;font-size:10px;font-weight:700;color:var(--warn);white-space:nowrap}
.bar-b{position:absolute;height:6px;top:12px;border-radius:99px;background:var(--s1);opacity:.7}
.bar-f{position:absolute;height:10px;top:24px;border-radius:99px;background:var(--c1)}
.bar-f.cr{background:var(--bad)}.bar-f.done{background:var(--ok)}
.bar-f .pr{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:rgba(0,0,0,.28)}
.dm{position:absolute;top:8px;width:13px;height:13px;transform:translateX(-50%) rotate(45deg);border:2px solid var(--c2);background:var(--card);z-index:1}
.dm.ok{background:var(--ok);border-color:var(--ok)}.dm.half{background:linear-gradient(135deg,var(--c2) 50%,var(--card) 50%)}
.dm.late{border-color:var(--bad)}
.need{position:absolute;top:2px;bottom:2px;border-left:2px dashed var(--bad);z-index:1}
.need em{position:absolute;bottom:-1px;left:3px;font-style:normal;font-size:10px;font-weight:700;color:var(--bad);white-space:nowrap}
.dml{position:absolute;top:24px;transform:translateX(-50%);font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.tlg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin:2px 0 10px}.tlg span{display:inline-flex;align-items:center;gap:6px}

/* gantt construction */

.tl-r.gx{cursor:pointer}.tl-r.gx:hover{background:var(--tint)}
.car{display:inline-block;width:14px;color:var(--muted)}
.gt .tl-r.sub{min-height:30px;background:var(--tint)}.gt .tl-r.sub .tr{height:30px}.tl-r.sub .lb{padding-left:18px}.tl-r.sub .lb b{font-weight:500;font-size:12px}

.bar-p{position:absolute;height:6px;top:12px;border-radius:99px;background:var(--c2)}
.wtbl{margin:10px 0 6px 30px;border:1px solid var(--line);border-radius:12px;overflow:hidden}

function trackUrls(s){const no=encodeURIComponent(String(s.no||'').replace(/\s+/g,'')),U=[];

  else if(/^\d{7}$/.test(String(s.imo||'').trim()))U.push(['Posisi kapal (AIS)','https://www.vesselfinder.com/vessels/details/'+String(s.imo).trim()]);
  else if(s.armada)U.push(['Posisi kapal (AIS)','https://www.vesselfinder.com/vessels?name='+encodeURIComponent(String(s.armada).split(/[·\/]|\bvoy/i)[0].replace(/^(MV|M\/V|KM)\s+/i,'').trim())]);

function shipView(){const S=D.ships||[],act=S.filter(shipOpenSt),tr=act.filter(function(s){return ['FOB','BERANGKAT','PERJALANAN'].indexOf(s.st)>=0}),port=act.filter(function(s){return s.st==='TIBA'||s.st==='CLEARANCE'});
  const slip=act.filter(function(s){return s.eta&&s.etaAwal&&s.eta>s.etaAwal}),nd=shipNoDoc();
  const cnt=function(a){const n={};a.forEach(function(s){(s.items||[]).forEach(function(i){n[i]=1})});return Object.keys(n).length};
  const late=act.filter(function(s){const n=shipNeed(s),m=shipMos(s);return n&&m&&wpos(m)>n.pos+0.001});
  let h='<div class="note" style="margin-bottom:12px"><b>Sumber:</b> dokumen FOB (Bill of Lading untuk laut, Air Waybill untuk udara).'+(D.canManage?' ADMIN mengunggah PDF/foto dokumen; Asisten PMO membaca nomor dokumen, kapal/penerbangan, pelabuhan dan tanggal, lalu ADMIN memeriksa sebelum menyimpan.':'')+' ETA dan waktu clearance menjadi <b>Perkiraan MOS</b> item, dipakai untuk risiko telat pasang.</div>';
  h+='<div class="kpis">'+kpi('Dalam perjalanan',tr.length+' <span>pengiriman</span>',cnt(tr)+' item')+kpi('Di pelabuhan / clearance',port.length+' <span>pengiriman</span>',cnt(port)+' item')+

/* ===================== TEMPLATE REALISASI PMO =====================
   Satu file per proyek: PETUNJUK, INFO, PROCUREMENT, CONSTRUCTION, COMMISSIONING (bidang yang sudah punya baseline).
   Dipakai juga untuk "Unduh hasil bacaan" (nilai tersimpan) sehingga hanya ada satu format. */
const TPL_CODE='EPCC-REALISASI-1';
const TPL_SH={PROC:'PROCUREMENT',CONS:'CONSTRUCTION',COM:'COMMISSIONING'};
const TPL_MS={PROC:['FAT_%','FOB_%','MOS_IMPOR_%','MOS_LOKAL_%'],CONS:['PREP_%','FAB_%','INS_%','FIN_%'],COM:['TAHAP_1_%','TAHAP_2_%','TAHAP_3_%']};
let TP=null;
function tpCol(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
/* skema Procurement 4+2: kolom = [label, slot milestone, tipe item, bobot tahap] */
function tpX(F,ms){return F==='PROC'&&!!ms&&(Number(ms[4])>0||Number(ms[5])>0)}
function tpOff(f,t,k){const P=f&&f.prof;if(!P||!P.length)return false;const p=P.filter(function(x){return x.c===t})[0];return !p||!(Number(p.w[k])>0)}
function tpCols(F,ms,pr){if(F==='CONS'&&pr&&pr.length)return [0,1,2,3].map(function(k){return ['TAHAP_'+(k+1)+'_%',k,'',null]});if(tpX(F,ms))return [['MANUFACTURING_IMPOR_%',3,'LN',ms[4]],['FAT_%',0,'LN',ms[0]],['FOB_%',1,'LN',ms[1]],['MOS_IMPOR_%',2,'LN',ms[2]],['FABRIKASI_LOKAL_%',0,'LK',ms[5]],['MOS_LOKAL_%',3,'LK',ms[3]]];
  return TPL_MS[F].map(function(l,k){return [l,k,F==='PROC'?(k<3?'LN':'LK'):'',ms?ms[k]:0]})}
function tpUsed(ms,t,k){const x=tpX('PROC',ms);return t==='LN'?(k<3||x):(k===3||(x&&k===0))}
function tpProg(F,t,m,ms,pr){m=m||[0,0,0,0];if(F==='CONS'&&pr&&pr.length){const pw=pr.filter(function(x){return x.c===t})[0];if(pw)ms=pw.w.map(Number)}if(F==='PROC')return t==='LN'?(ms[0]*m[0]+ms[1]*m[1]+ms[2]*m[2]+(Number(ms[4])||0)*(Number(m[3])||0))/100:(ms[3]*m[3]+(Number(ms[5])||0)*(Number(m[0])||0))/100;return (ms[0]*m[0]+ms[1]*m[1]+ms[2]*m[2]+(ms[3]||0)*(m[3]||0))/100}
function tpPlan(plan,w){if(!plan||!plan.length||w<1)return 0;return Number(plan[Math.min(plan.length,w)-1])||0}
function tpPack(cb){run('getEpccWeekPack',[token,D.project.id],function(pk){if(!pk||!pk.fields||!pk.fields.length){toast('Belum ada bidang dengan baseline di proyek ini.');return}cb(pk)})}

  document.querySelectorAll('[data-syd]').forEach(function(b){b.onclick=function(){const lap=b.getAttribute('data-syd');

  const wa=$('syWAll');if(wa)wa.onchange=function(){const r=ckCompute();r.wdiff.forEach(function(x){if(wa.checked)syW[x.o.id]=1;else delete syW[x.o.id]});render()};

/* ===================== CONSTRUCTION · item level 4 di Gantt & item LOE ===================== */
function l4Pos(o,g,mode){const S=M.S,C=mode==='base'?M.CB:M.CF,r=C.R[g.id],own=o.loe&&g.items.indexOf(o)<0;
  if(own||!r){if(mode==='base')return {es:o.ps-1,ef:o.pf};if(o.ac>=99.99)return {es:Math.min(o.pf,S),ef:Math.min(o.pf,S),done:1};const n=fcNode(o,S);return {es:n.snet,ef:n.snet+n.dur}}
  if(mode==='base'){const sh=r.es-(g.ps-1);return {es:o.ps-1+sh,ef:o.pf+sh}}
  if(o.ac>=99.99)return {es:Math.min(o.pf,S),ef:Math.min(o.pf,S),done:1};
  if(M.NF[g.id]&&M.NF[g.id].st){const n=fcNode(o,S);return {es:n.snet,ef:n.snet+n.dur}}
  const sh=r.es-(g.ps-1);return {es:Math.max(S,o.ps-1+sh),ef:Math.max(S,o.ps-1+sh)+(o.pf-o.ps+1)}}
function l4Row(it,g,gcr,X,p0,p1){const own=it.loe&&g.items.indexOf(it)<0,ps=l4Pos(it,g,cpMode),dn=it.ac>=99.99,dev=it.ac-it.pl;
  const cls=dn?' done':own?' loe':gcr?' cr':'';
  const tag=D.canManage?'<button type="button" class="tg '+(own?'loe':'nrm')+' tgb" data-loe="'+esc(it.id)+'" title="Ubah status LOE">'+(own?'LOE':'Normal')+(it.loex&&it.loex!=='AUTO'?' · ADMIN':'')+'</button>':own?'<span class="tg loe">LOE</span>':'';
  return '<div class="tl-r sub'+(own?' loe':'')+'"><div class="lb"><b title="'+esc(it.n)+'">'+esc(it.n)+'</b><small>'+esc(it.c)+' · '+pc(it.ac,0)+' / rencana '+pc(it.pl,0)+(dev<-0.05&&!dn?' <span class="neg">'+sg(dev,0)+'</span>':'')+' '+tag+'</small></div><div class="tr">'+tlGrid(p0,p1,1)+
    '<i class="bar-b" style="left:'+X(it.ps)+';width:calc('+X(it.pf+1)+' - '+X(it.ps)+')"></i>'+
    (ps.ef-ps.es>0.01?'<i class="bar-f'+cls+'" style="left:'+X(ps.es+1)+';width:calc('+X(ps.ef+1)+' - '+X(ps.es+1)+')" title="'+wl(Math.floor(ps.es)+1)+'–'+wl(Math.ceil(ps.ef))+'"><i class="pr" style="width:'+Math.min(100,it.ac).toFixed(1)+'%"></i></i>':'<i class="dm ok" style="left:'+X(ps.ef+1)+';top:12px"></i>')+'</div></div>'}
function openLoe(id){const o=M.IX[id];if(!o)return;let v=o.loex||'AUTO';
  const draw=function(){const opt=function(val,b,sm){return '<label class="opt-i'+(v===val?' on':'')+'"><input type="radio" name="loeV" value="'+val+'"'+(v===val?' checked':'')+'><span><b>'+b+'</b><small>'+sm+'</small></span></label>'};
    $('dmBody').innerHTML='<div class="dm-h"><div><h2 id="dmTitle">Status LOE · '+esc(o.c)+'</h2><p>'+esc(o.n)+' · rencana '+wl(o.ps)+'–'+wl(o.pf)+' · bobot '+pc(o.w,3)+'</p></div><button type="button" class="icon-btn x" data-close aria-label="Tutup"><i class="ic" data-ic="x"></i></button></div><div class="dm-b">'+
      '<p class="sub" style="margin:0 0 8px">Item <b>LOE</b> (sepanjang proyek: K3, mobilisasi, dokumentasi, QA/QC…) tidak dihitung di CPM grupnya, memakai jadwal rencananya sendiri, dan bila tertinggal hanya masuk daftar opsional "tidak menggeser jadwal".</p>'+
      '<div class="opt2 o3">'+opt('AUTO','Otomatis','Sekarang: '+(o.loeAuto?'LOE ('+esc(o.loeWhy)+')':'Normal'))+opt('YA','LOE','Tidak ikut CPM grup')+opt('TIDAK','Normal','Ikut CPM grup '+esc(o.gc))+'</div>'+
      '<label class="fld" style="margin-top:10px"><span>Alasan '+(v==='AUTO'?'(opsional)':'(wajib)')+'</span><input class="inp" id="loeWhy" maxlength="300" placeholder="Contoh: K3 berjalan sepanjang proyek, tidak punya predecessor"></label>'+
      ((o.loelog||[]).length?'<div class="vh">Riwayat</div><ul class="sp-hist">'+o.loelog.slice().reverse().map(function(l){return '<li><b>'+esc(l.at)+'</b> · '+esc(l.by)+' · '+(l.v==='YA'?'LOE':l.v==='TIDAK'?'Normal':'Otomatis')+(l.why?'<br>'+esc(l.why):'')+'</li>'}).join('')+'</ul>':'')+
      '<div class="row" style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px"><button type="button" class="btn" data-close>Batal</button><button type="button" class="btn pri" id="loeOk"><i class="ic" data-ic="check"></i>Simpan</button></div></div>';
    paint($('dateModal'));
    $('dateModal').querySelectorAll('input[name=loeV]').forEach(function(i){i.onchange=function(){const w=$('loeWhy').value;v=i.value;draw();$('loeWhy').value=w}});
    $('dateModal').querySelectorAll('[data-close]').forEach(function(b){b.onclick=function(){$('dateModal').hidden=true}});
    $('loeOk').onclick=function(){const why=$('loeWhy').value.trim();if(v===(o.loex||'AUTO')){toast('Tidak ada perubahan.');return}if(v!=='AUTO'&&!why){toast('Isi alasan koreksi.');$('loeWhy').focus();return}
      run('saveEpcLoe',[token,D.project.id,{item:o.id,loe:v,alasan:why}],function(d){$('dateModal').hidden=true;D=d;build();render();toast('Status LOE '+o.c+' diperbarui.')})}};
  draw();$('dateModal').hidden=false}

</script>

<script>
/* ===== Pratinjau dokumen (Drive, Google Docs/Sheets/Slides, PDF, Office, gambar) ===== */
(function(){
  var SV={
    eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };
  window.pmoSvg=SV;
  function enc(s){return encodeURIComponent(s)}
  function plan(raw){
    var u;try{u=new URL(String(raw||'').trim())}catch(e){return null}
    if(!/^https?:$/.test(u.protocol))return null;
    var h=u.hostname.toLowerCase(),p=u.pathname,m,id;
    if(h==='drive.google.com'){
      if((m=p.match(/\/file\/d\/([^/]+)/)))return {src:'https://drive.google.com/file/d/'+enc(m[1])+'/preview',refit:true};
      if((m=p.match(/\/folders\/([^/?#]+)/)))return {src:'https://drive.google.com/embeddedfolderview?id='+enc(m[1])+'#grid'};
      id=u.searchParams.get('id');if(id)return {src:'https://drive.google.com/file/d/'+enc(id)+'/preview',refit:true};
      return null;
    }
    if(h==='docs.google.com'){
      if((m=p.match(/^\/(document|spreadsheets|presentation|drawings)\/d\/([^/]+)/)))return {src:'https://docs.google.com/'+m[1]+'/d/'+enc(m[2])+'/preview'};
      if((m=p.match(/^\/file\/d\/([^/]+)/)))return {src:'https://drive.google.com/file/d/'+enc(m[1])+'/preview',refit:true};
      return null;
    }
    if(h==='youtu.be'||/(^|\.)youtube\.com$/.test(h)){
      id=h==='youtu.be'?p.split('/').filter(Boolean)[0]:(u.searchParams.get('v')||((p.match(/\/(?:embed|shorts|live)\/([^/]+)/)||[])[1]));
      return id?{src:'https://www.youtube-nocookie.com/embed/'+enc(id)}:null;
    }
    if(h==='1drv.ms'&&/^\/[bui]\//.test(p)){u.searchParams.delete('action');return {od:true,link:u.href}}
    if(h==='onedrive.live.com'&&/file,(pdf|png|jpe?g|gif|webp)/i.test(u.searchParams.get('ithint')||'')&&u.searchParams.get('redeem')){try{return {od:true,link:atob(u.searchParams.get('redeem').replace(/-/g,'+').replace(/_/g,'/'))}}catch(e){}}
    if(h==='1drv.ms'||h==='onedrive.live.com'||/(^|\.)sharepoint\.com$/.test(h)){
      if(h==='onedrive.live.com'&&/^\/(redir|view\.aspx)$/i.test(p)&&u.searchParams.get('resid')){u.pathname='/embed';return {src:u.href}}
      u.searchParams.set('action','embedview');return {src:u.href,ms:/sharepoint\.com$/.test(h)};
    }
    if(/\.pdf$/i.test(p))return {src:'https://docs.google.com/viewer?embedded=true&url='+enc(u.href)};
    if(/\.(png|jpe?g|gif|webp|svg)$/i.test(p))return {src:u.href,img:true};
    if(/\.(docx?|xlsx?|pptx?)$/i.test(p))return {src:'https://view.officeapps.live.com/op/embed.aspx?src='+enc(u.href)};
    return null;
  }
  window.pmoPreviewable=function(url){return !!plan(url)};
  var wrap,body,cur=null,lastW=0,lastH=0,rt=0,prevOverflow='',prevFocus=null;
  function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
  function build(){
    wrap=el('div','pv-wrap');wrap.hidden=true;
    wrap.innerHTML='<div class="pv-box" role="dialog" aria-modal="true" aria-labelledby="pvTitle"><div class="pv-head"><div class="pv-title"><small id="pvSub"></small><b id="pvTitle"></b></div><a class="pv-btn" id="pvOpen" target="_blank" rel="noopener" title="Buka di tab baru">'+SV.ext+'<span class="pv-lbl">Buka di tab baru</span></a><button type="button" class="pv-btn pv-x" id="pvClose" title="Tutup pratinjau" aria-label="Tutup pratinjau">'+SV.x+'</button></div><div class="pv-body" id="pvBody"></div><div class="pv-foot" id="pvFoot"></div></div>';
    document.body.appendChild(wrap);body=wrap.querySelector('#pvBody');
    wrap.addEventListener('click',function(e){if(e.target===wrap)close()});
    wrap.querySelector('#pvClose').addEventListener('click',close);
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&wrap&&!wrap.hidden)close()});
    window.addEventListener('resize',function(){
      if(!cur||!cur.refit||wrap.hidden||window.pmoInFullscreen())return;
      clearTimeout(rt);rt=setTimeout(function(){if(window.pmoInFullscreen())return;if(Math.abs(body.clientWidth-lastW)>24||Math.abs(body.clientHeight-lastH)>24)load()},500);
    });
  }
  var fsT=0;
  function fsMark(){fsT=Date.now()}
  document.addEventListener('fullscreenchange',fsMark);document.addEventListener('webkitfullscreenchange',fsMark);
  /* true saat layar penuh aktif atau baru saja berubah: jangan muat ulang player pada kondisi ini */
  window.pmoInFullscreen=function(){return !!(document.fullscreenElement||document.webkitFullscreenElement)||Date.now()-fsT<1500};
  function msg(html){body.innerHTML='<div class="pv-msg">'+html+'</div>'}
  /* File PDF/gambar OneDrive pribadi tidak bisa di-embed langsung: ambil tautan unduh sementara (sesi tamu OneDrive),
     lalu tampilkan lewat Google Docs Viewer (PDF) atau <img> (gambar). */
  var odTok=null;
  function odToken(){
    if(odTok&&odTok.exp>Date.now()+60000)return Promise.resolve(odTok.t);
    return fetch('https://api-badgerp.svc.ms/v1.0/token',{method:'POST',headers:{'Content-Type':'application/json','AppId':'5cbed6ac-a083-4e14-b191-b4ba07653de2'},body:JSON.stringify({appId:'5cbed6ac-a083-4e14-b191-b4ba07653de2'})})
      .then(function(r){if(!r.ok)throw new Error('token '+r.status);return r.json()})
      .then(function(j){odTok={t:j.token,exp:Date.parse(j.expiryTimeUtc)||Date.now()+1800000};return j.token});
  }
  function odResolve(link){
    var id='u!'+btoa(unescape(encodeURIComponent(link))).replace(/=+$/,'').replace(/\//g,'_').replace(/\+/g,'-');
    return odToken().then(function(t){return fetch('https://my.microsoftpersonalcontent.com/_api/v2.0/shares/'+id+'/driveitem?$select=name,file,@content.downloadUrl',{headers:{Authorization:'Badger '+t,Prefer:'autoredeem'}})})
      .then(function(r){if(!r.ok)throw new Error('item '+r.status);return r.json()});
  }
  /* dipakai form input untuk mengecek link OneDrive (berhasil = bisa dibuka tanpa login) */
  window.pmoOdResolve=function(url){
    var u=new URL(String(url).trim());u.searchParams.delete('action');
    if(u.hostname==='onedrive.live.com'&&u.searchParams.get('redeem')){try{return odResolve(atob(u.searchParams.get('redeem').replace(/-/g,'+').replace(/_/g,'/')))}catch(e){}}
    return odResolve(u.href);
  };
  function frame(src){
    var f=document.createElement('iframe');f.title='Pratinjau dokumen';f.setAttribute('allow','autoplay; encrypted-media; fullscreen');f.setAttribute('allowfullscreen','');
    f.onload=function(){f.style.background='#fff';var m=body.querySelector('.pv-msg');if(m)m.remove()};
    f.src=src;body.appendChild(f);
  }
  function load(){
    if(!cur)return;
    lastW=body.clientWidth;lastH=body.clientHeight;
    if(cur.od){
      var mine=cur;msg('<div class="pv-spin" aria-hidden="true"></div><span>Menyiapkan pratinjau OneDrive…</span>');
      odResolve(cur.link).then(function(it){
        if(cur!==mine)return;
        var dl=it['@content.downloadUrl'],nm=String(it.name||''),mt=String((it.file&&it.file.mimeType)||'');
        if(!dl)throw new Error('no url');
        if(/^image\//.test(mt)||/\.(png|jpe?g|gif|webp)$/i.test(nm)){body.innerHTML='';var im=new Image();im.alt=nm;im.src=dl;body.appendChild(im);return}
        if(/\.(docx?|xlsx?|pptx?)$/i.test(nm)){frame('https://view.officeapps.live.com/op/embed.aspx?src='+enc(dl));return}
        frame('https://docs.google.com/viewer?embedded=true&url='+enc(dl));
      }).catch(function(){
        if(cur!==mine)return;
        msg('<b>Pratinjau OneDrive tidak bisa dimuat</b><span>Pastikan file dibagikan "Siapa saja yang memiliki link", atau buka langsung di OneDrive.</span><a class="pv-btn" href="'+String(mine.link).replace(/"/g,'&quot;')+'" target="_blank" rel="noopener">'+SV.ext+'<span>Buka di tab baru</span></a>');
      });
      return;
    }
    if(cur.img){body.innerHTML='';var im=new Image();im.alt='';im.src=cur.src;body.appendChild(im);return}
    msg('<div class="pv-spin" aria-hidden="true"></div><span>Memuat pratinjau…</span>');
    var f=document.createElement('iframe');f.title='Pratinjau dokumen';f.setAttribute('allow','autoplay; encrypted-media; fullscreen');f.setAttribute('allowfullscreen','');
    f.onload=function(){f.style.background='#fff';var m=body.querySelector('.pv-msg');if(m)m.remove()};
    f.src=cur.src;body.appendChild(f);
  }
  function close(){
    if(!wrap||wrap.hidden)return;
    wrap.hidden=true;body.innerHTML='';cur=null;document.body.style.overflow=prevOverflow;
    if(prevFocus&&prevFocus.focus)try{prevFocus.focus()}catch(e){}
  }
  window.pmoPreview=function(url,title,sub){
    url=String(url||'').trim();
    if(!/^https?:\/\//i.test(url)){alert('Tautan dokumen tidak valid.');return}
    if(!wrap)build();
    prevFocus=document.activeElement;
    wrap.querySelector('#pvTitle').textContent=title||'Dokumen';
    wrap.querySelector('#pvSub').textContent=sub||'Pratinjau dokumen';
    wrap.querySelector('#pvOpen').href=url;
    prevOverflow=document.body.style.overflow;document.body.style.overflow='hidden';
    wrap.hidden=false;
    cur=plan(url);
    wrap.querySelector('#pvFoot').innerHTML=cur&&cur.ms?'File SharePoint/OneDrive kantor hanya tampil bila Anda sudah login Microsoft 365 di browser ini. Jika kosong atau meminta login, gunakan <b>Buka di tab baru</b>.':'Jika pratinjau tidak tampil (misalnya file belum dibagikan ke akun Anda), gunakan <b>Buka di tab baru</b>.';
    if(!cur){msg('<b>Pratinjau tidak tersedia untuk tautan ini</b><span>Jenis tautan ini tidak bisa ditampilkan di dalam dashboard.</span><a class="pv-btn" href="'+url.replace(/"/g,'&quot;')+'" target="_blank" rel="noopener">'+SV.ext+'<span>Buka di tab baru</span></a>');}
    else requestAnimationFrame(function(){requestAnimationFrame(load)});
    wrap.querySelector('#pvClose').focus();
  };
