<style>
/* ===== Menu akun (sama dengan Portal): nama, akses, tema terang/gelap, keluar ===== */
.acm-wrap{position:relative;flex:none}
.acm-chip{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border:1px solid var(--line,#e0e8f0);border-radius:99px; background:var(--card,#fff);color:var(--ink,#132b43);text-align:left;cursor:pointer;font:inherit;min-height:0}
.acm-chip:hover{background:var(--tint,#f4f8fc)}
.acm-chip .av{width:34px;height:34px;border-radius:50%;background:var(--pri,#0f5fa8);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.acm-t{min-width:0}.acm-t b{display:block;font-size:13px;line-height:1.2;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink,#132b43)}
.acm-t small{display:block;font-size:11px;color:var(--muted,#5b7085);line-height:1.3}
.acm-caret{width:14px;height:14px;color:var(--muted,#5b7085);flex:none;display:inline-grid}.acm-caret svg{width:100%;height:100%}
.acm-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:120;width:min(268px,calc(100vw - 24px));background:var(--card,#fff);color:var(--ink,#132b43);border:1px solid var(--line,#e0e8f0);border-radius:14px;box-shadow:0 18px 40px rgba(5,15,30,.28);padding:14px;text-align:left}
.acm-pop[hidden]{display:none!important}
.acm-acc{padding:0 2px 12px;border-bottom:1px solid var(--line,#e0e8f0);font-size:13px;font-weight:600}
.acm-acc small{display:block;font-weight:500;color:var(--muted,#5b7085);margin-top:2px}
.acm-lbl{margin:12px 2px 8px;color:var(--muted,#5b7085);font-size:12px;font-weight:600}
.acm-theme{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;border:1px solid var(--line,#e0e8f0);border-radius:10px;background:var(--tint,#f4f8fc)}
.acm-theme button{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border:0;border-radius:8px;background:transparent;color:var(--muted,#5b7085);font:inherit;font-weight:600;font-size:13px;cursor:pointer;min-height:0}
.acm-theme button svg{width:16px;height:16px}
.acm-theme button.on{background:var(--card,#fff);color:var(--pri-ink,var(--pri,#0f5fa8));box-shadow:0 1px 2px rgba(13,49,79,.08),0 4px 12px rgba(13,49,79,.08)}
.acm-out{display:flex;align-items:center;gap:8px;width:100%;margin-top:12px;padding:10px 12px;border:1px solid var(--bad-line,#f5b4ad);border-radius:10px;background:var(--bad-bg,#ffe3df);color:var(--bad,#c0302f);font:inherit;font-weight:700;font-size:13px;cursor:pointer;min-height:0}
.acm-out svg{width:16px;height:16px}
:root[data-theme="dark"] .acm-out{background:var(--bad-bg,#3d1d20);border-color:var(--bad-line,#6a2f33);color:var(--bad,#ff8c86)}
@media (max-width:760px){.acm-t,.acm-caret{display:none}.acm-chip{padding:3px;border-radius:50%}.acm-pop{position:fixed;right:12px;left:auto}}
html.m-mode .acm-wrap,html.m-mode .acm-wrap #userAv{display:grid!important}
/* menu Master Schedule tampil juga di HP (navigasi HP seragam di bagian akhir file) */

/* ===== Notifikasi (lonceng di samping menu akun) ===== */
.ntf-wrap{position:relative;flex:none;display:flex;align-items:center}
.ntf-btn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line,#e0e8f0);background:var(--card,#fff);color:var(--ink,#132b43);display:grid;place-items:center;cursor:pointer;padding:0;min-height:0}
.ntf-btn:hover{background:var(--tint,#f4f8fc)}
.ntf-btn svg{width:20px;height:20px}
.ntf-btn.ring svg{animation:ntfRing 1.2s ease 1}
@keyframes ntfRing{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}}
.ntf-badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:#e5484d;color:#fff;font:700 11px/19px Inter,system-ui,sans-serif;text-align:center;border:2px solid var(--card,#fff)}
.ntf-badge[hidden]{display:none}
.ntf-pop{position:absolute;right:0;top:calc(100% + 10px);z-index:130;width:min(390px,calc(100vw - 24px));max-height:min(560px,calc(100vh - 90px));display:flex;flex-direction:column;background:var(--card,#fff);color:var(--ink,#132b43);border:1px solid var(--line,#e0e8f0);border-radius:16px;box-shadow:0 22px 48px rgba(5,15,30,.28);text-align:left;overflow:hidden;font-family:Inter,system-ui,sans-serif}
.ntf-pop[hidden]{display:none!important}
.ntf-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line,#e0e8f0)}
.ntf-h b{font-size:15px;flex:1}
.ntf-un{padding:3px 10px;border-radius:99px;background:var(--soft,#e8f3fb);color:var(--pri-ink,#0f5fa8);font-size:12px;font-weight:700}
.ntf-ic{width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:var(--muted,#5b7085);display:grid;place-items:center;cursor:pointer;padding:0;min-height:0}
.ntf-ic:hover{background:var(--tint,#f4f8fc);color:var(--ink,#132b43)}.ntf-ic svg{width:17px;height:17px}
.ntf-list{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.ntf-it{display:grid;grid-template-columns:38px minmax(0,1fr) 10px;gap:12px;padding:13px 16px;border-top:1px solid var(--line,#e0e8f0);cursor:pointer}
.ntf-it:first-child{border-top:0}.ntf-it:hover{background:var(--tint,#f4f8fc)}
.ntf-av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}.ntf-av svg{width:18px;height:18px}
.ntf-it.k-account .ntf-av{background:#efe8fc;color:#7a3fd1}.ntf-it.k-weekly .ntf-av{background:#e8f3fb;color:#0f5fa8}.ntf-it.k-monthly .ntf-av{background:#fff1c7;color:#7d5500}
:root[data-theme="dark"] .ntf-it.k-account .ntf-av{background:#2b2150;color:#c4a7ff}:root[data-theme="dark"] .ntf-it.k-weekly .ntf-av{background:#1b3550;color:#8fcaf6}:root[data-theme="dark"] .ntf-it.k-monthly .ntf-av{background:#3d3112;color:#f0c35a}
.ntf-t{font-size:13.5px;font-weight:700;line-height:1.35;color:var(--ink,#132b43)}
.ntf-it.seen .ntf-t{font-weight:600;color:var(--muted,#5b7085)}
.ntf-p{font-size:12px;font-weight:700;color:var(--pri-ink,#0f5fa8);margin-top:2px;letter-spacing:.01em}
.ntf-x{font-size:12.5px;line-height:1.5;color:var(--muted,#5b7085);margin-top:2px}
.ntf-m{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11.5px;color:var(--muted,#5b7085)}
.ntf-lv{padding:1px 7px;border-radius:6px;font-weight:700;font-size:11px}
.ntf-lv.bad{background:var(--bad-bg,#ffe3df);color:var(--bad,#c0302f)}.ntf-lv.warn{background:var(--warn-bg,#fff0bd);color:var(--warn,#8f6100)}.ntf-lv.info{background:var(--soft,#e8f3fb);color:var(--pri-ink,#0f5fa8)}
.ntf-dot{width:9px;height:9px;border-radius:50%;background:var(--pri,#0f5fa8);margin-top:6px}
.ntf-it.seen .ntf-dot{visibility:hidden}
.ntf-empty{padding:30px 20px;text-align:center;color:var(--muted,#5b7085);font-size:13px;line-height:1.6}
.ntf-empty svg{width:34px;height:34px;color:#16875d;display:block;margin:0 auto 8px}
.ntf-f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-top:1px solid var(--line,#e0e8f0);background:var(--tint,#f4f8fc);font-size:11.5px;color:var(--muted,#5b7085)}
.ntf-f button{border:0;background:transparent;color:var(--pri-ink,#0f5fa8);font:600 12px Inter,system-ui,sans-serif;cursor:pointer;padding:4px 6px;border-radius:7px;min-height:0}
@media (max-width:760px){.ntf-btn{width:36px;height:36px}.ntf-pop{position:fixed;right:12px;left:12px;width:auto}}
html.m-mode .ntf-wrap{display:flex!important}

/* Badge status: titik + label, tetap terbaca tanpa warna dan saat dicetak hitam-putih */
.pp-st.ok::before,.pp-st.warn::before,.pp-st.bad::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;vertical-align:.1em;flex:none;margin-right:5px}
</style>
<script>
/* Ganti avatar / chip pengguna di header dengan menu akun seperti di Portal. Tombol tema lama disembunyikan (fungsinya pindah ke menu). */
(function(){
  var SVG=function(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'};
  var I={down:'<path d="M6 9l6 6 6-6"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',out:'<path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/>'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function tok(){try{if(typeof token!=='undefined'&&token)return token}catch(e){}try{return sessionStorage.getItem('pmoSessionToken')||''}catch(e){return ''}}
  function url(){try{if(typeof appUrl!=='undefined'&&appUrl)return appUrl}catch(e){}return String(window.location.href).split('?')[0]}
  function build(){
    if(document.querySelector('.account-wrap'))return; // halaman dengan menu akun sendiri (Portal, Executive, Weekly)
    var av=document.getElementById('userAv');if(!av||document.getElementById('acmWrap'))return;
    var host=av.closest('.userchip')||av,nameEl=document.getElementById('userName'),roleEl=document.getElementById('userRole');
    if(nameEl&&!host.contains(nameEl))nameEl=null;if(roleEl&&!host.contains(roleEl))roleEl=null;
    var wrap=document.createElement('div');wrap.className='acm-wrap';wrap.id='acmWrap';
    wrap.innerHTML='<button type="button" class="acm-chip" id="acmToggle" aria-haspopup="true" aria-expanded="false" aria-controls="acmPop" title="Akun"><span class="acm-av-slot"></span><div class="acm-t"><span class="acm-n"></span><span class="acm-r"></span></div><i class="acm-caret">'+SVG(I.down)+'</i></button>'+
      '<div class="acm-pop" id="acmPop" hidden role="menu"><div class="acm-acc" id="acmAcc">Akses: —</div><div class="acm-lbl">Tampilan</div>'+
      '<div class="acm-theme"><button type="button" data-t="light">'+SVG(I.sun)+'Terang</button><button type="button" data-t="dark">'+SVG(I.moon)+'Gelap</button></div>'+
      '<button type="button" class="acm-out" id="acmOut">'+SVG(I.out)+'<span>Keluar</span></button></div>';
    host.parentNode.insertBefore(wrap,host);
    var chip=wrap.querySelector('.acm-chip');
    chip.querySelector('.acm-av-slot').replaceWith(av);av.removeAttribute('title');
    var n=nameEl||document.createElement('b'),r=roleEl||document.createElement('small');
    if(!nameEl){n.id='acmName';n.textContent='Memeriksa sesi…'}if(!roleEl)r.id='acmRole';
    chip.querySelector('.acm-n').replaceWith(n);chip.querySelector('.acm-r').replaceWith(r);
    if(host!==av&&host.parentNode)host.parentNode.removeChild(host);
    var tb=document.getElementById('themeBtn');if(tb)tb.style.display='none';
    var pop=wrap.querySelector('.acm-pop');
    var open=function(v){if(v){pop.style.top=window.innerWidth<=760?Math.round(chip.getBoundingClientRect().bottom+8)+'px':''}pop.hidden=!v;chip.setAttribute('aria-expanded',String(!!v))};
    chip.addEventListener('click',function(e){e.stopPropagation();open(pop.hidden)});
    document.addEventListener('click',function(e){if(!pop.hidden&&!wrap.contains(e.target))open(false)});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!pop.hidden){open(false);chip.focus()}});
    var sync=function(){var d=document.documentElement.getAttribute('data-theme')==='dark';pop.querySelectorAll('[data-t]').forEach(function(b){b.classList.toggle('on',(b.getAttribute('data-t')==='dark')===d)})};
    pop.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){var d=b.getAttribute('data-t')==='dark';document.documentElement.setAttribute('data-theme',d?'dark':'light');try{localStorage.setItem('pmoExecutiveTheme',d?'dark':'light')}catch(e){}try{if(typeof themeIcon==='function')themeIcon()}catch(e){}sync()}});
    sync();
    document.getElementById('acmOut').onclick=function(){
      var unsaved=false;try{unsaved=typeof dirty!=='undefined'&&!!dirty}catch(e){}
      if(unsaved&&!window.confirm('Ada perubahan yang belum disimpan. Tetap keluar?'))return;
      var b=this;b.disabled=true;b.lastChild.textContent='Keluar…';
      var go=function(){try{dirty=false}catch(e){}window.onbeforeunload=null;try{sessionStorage.removeItem('pmoSessionToken');sessionStorage.removeItem('pmoUser')}catch(e){}window.top.location.href=url()};
      var t=tok();if(!t||typeof google==='undefined'||!google.script){go();return}
      google.script.run.withSuccessHandler(go).withFailureHandler(go).authLogout(t)};
    // isi nama, peran, dan akses dari sesi
    var t=tok();if(!t||typeof google==='undefined'||!google.script)return;
    google.script.run.withSuccessHandler(function(s){if(!s||!s.success||!s.user)return;var u=s.user,nm=u.name||u.username||'Pengguna',role=String(u.role||'').toUpperCase();
      if(['ADMIN','INPUT','PIC'].indexOf(role)>=0)document.querySelectorAll('[data-mr]').forEach(function(b){b.hidden=false});
      if(!n.textContent||/Memeriksa/.test(n.textContent))n.textContent=nm;
      if(!r.textContent)r.textContent=role?role.charAt(0)+role.slice(1).toLowerCase():'';
      if(!av.textContent||av.textContent==='–'||av.textContent==='-')av.textContent=String(nm).trim().split(/\s+/).slice(0,2).map(function(p){return p.charAt(0)}).join('').toUpperCase();
      var pj=String(u.projectId||u.project||'').trim();
      document.getElementById('acmAcc').innerHTML='Akses: '+esc(role||'USER')+'<small>Proyek: '+esc(pj?(pj.toUpperCase()==='ALL'?'ALL':pj):(role==='ADMIN'?'ALL':'—'))+'</small>';
    }).withFailureHandler(function(){}).authGetSession(t);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',build);else build();
  /* buka Master Schedule dengan proyek yang sedang dibuka (bila ada) */
  window.pmoGoMaster=function(){
    var unsaved=false;try{unsaved=typeof dirty!=='undefined'&&!!dirty}catch(e){}
    if(unsaved&&!window.confirm('Ada perubahan yang belum disimpan. Tetap pindah halaman?'))return;
    try{dirty=false}catch(e){}window.onbeforeunload=null;
    var el=document.getElementById('pjName'),nm=el?String(el.textContent||'').trim():'';if(nm==='–'||nm==='-')nm='';
    window.top.location.href=url()+'?page=master'+(nm?'&project='+encodeURIComponent(nm):'');
  };
})();
</script>
<script>
/* ===== Notifikasi menu akun: persetujuan akun (ADMIN), input mingguan & laporan bulanan yang lewat cut-off ===== */
(function(){
  if(window.__pmoNtf)return;window.__pmoNtf=true;
  var SV=function(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'};
  var I={bell:'<path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/>',user:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0114 0"/><path d="M19 8v6M16 11h6"/>',week:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 15h3"/>',month:'<path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',read:'<path d="M3 9l9 6 9-6"/><path d="M21 9v10a2 2 0 01-2 2H5a2 2 0 01-2-2V9l9-6z"/>',ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',ref:'<path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/>'};
  var KI={account:I.user,weekly:I.week,monthly:I.month,review:I.ok},LV={bad:'Terlambat',warn:'Perlu diisi',info:'Menunggu'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function tok(){try{if(typeof token!=='undefined'&&token)return token}catch(e){}try{return sessionStorage.getItem('pmoSessionToken')||''}catch(e){return ''}}
  function base(){try{if(typeof appUrl!=='undefined'&&appUrl)return appUrl}catch(e){}return String(window.location.href).split('?')[0]}
  function name(n){return String(n||'').toLowerCase().replace(/(^|[\s(\-\/])([a-z])/g,function(m,a,c){return a+c.toUpperCase()}).replace(/\b(Csu|Sa|Ubb|Pt)\b/g,function(w){return w.toUpperCase()})}
  var data=null,user='',wrap,btn,pop,badge;
  function seenKey(){return 'pmoNtfSeen:'+(user||'u')}
  function seen(){try{return JSON.parse(localStorage.getItem(seenKey())||'[]')}catch(e){return []}}
  function setSeen(ids){try{localStorage.setItem(seenKey(),JSON.stringify(ids.slice(-300)))}catch(e){}}
  function unread(){var s=seen();return (data&&data.items||[]).filter(function(x){return s.indexOf(x.id)<0})}
  function paint(){
    var items=data&&data.items||[],s=seen(),n=unread().length;
    badge.hidden=!n;badge.textContent=n>99?'99+':n;btn.setAttribute('aria-label','Notifikasi'+(n?' ('+n+' belum dibaca)':''));
    var h='<div class="ntf-h"><b>Notifikasi</b>'+(n?'<span class="ntf-un">'+n+' belum dibaca</span>':'')+'<button type="button" class="ntf-ic" data-a="read" title="Tandai semua dibaca" aria-label="Tandai semua dibaca">'+SV(I.read)+'</button></div>';
    if(!data)h+='<div class="ntf-empty">Memuat notifikasi…</div>';
    else if(!items.length)h+='<div class="ntf-empty">'+SV(I.ok)+'<b>Semua beres.</b><br>Tidak ada input mingguan, laporan bulanan, atau persetujuan akun yang tertunda.</div>';
    else h+='<ul class="ntf-list">'+items.map(function(x,i){return '<li class="ntf-it k-'+esc(x.kind)+(s.indexOf(x.id)>=0?' seen':'')+'" data-i="'+i+'" tabindex="0" role="button"><span class="ntf-av">'+SV(KI[x.kind]||I.bell)+'</span><div><div class="ntf-t">'+esc(x.title)+'</div>'+(x.project?'<div class="ntf-p">'+esc(name(x.project))+'</div>':'')+'<div class="ntf-x">'+esc(x.text)+'</div><div class="ntf-m"><span class="ntf-lv '+esc(x.level)+'">'+(LV[x.level]||'')+'</span>'+(x.when?'<span>'+esc(x.when)+'</span>':'')+'</div></div><span class="ntf-dot" aria-hidden="true"></span></li>'}).join('')+'</ul>';
    h+='<div class="ntf-f"><span>'+(data&&data.at?'Diperbarui '+esc(data.at):'')+'</span><button type="button" data-a="ref">Muat ulang</button></div>';
    pop.innerHTML=h;
    pop.querySelectorAll('.ntf-it').forEach(function(li){var go=function(){open_(items[+li.getAttribute('data-i')])};li.onclick=go;li.onkeydown=function(e){if(e.key==='Enter')go()}});
    pop.querySelector('[data-a=read]').onclick=function(e){e.stopPropagation();setSeen(seen().concat(items.map(function(x){return x.id})));paint()};
    pop.querySelector('[data-a=ref]').onclick=function(e){e.stopPropagation();load(true)};
  }
  function open_(x){
    if(!x)return;var s=seen();if(s.indexOf(x.id)<0){s.push(x.id);setSeen(s)}
    var a=x.action||{};
    if(a.fn==='pwdAdmin'&&window.pmoPwd){toggle(false);paint();pmoPwd.admin();return}
    if(a.anchor){var el=document.getElementById(a.anchor);if(el){toggle(false);el.hidden=false;el.scrollIntoView({behavior:'smooth',block:'start'});paint();return}}
    try{if(typeof dirty!=='undefined'&&dirty&&!window.confirm('Ada perubahan yang belum disimpan. Tetap pindah halaman?'))return}catch(e){}
    try{dirty=false}catch(e){}window.onbeforeunload=null;
    window.top.location.href=base()+'?page='+encodeURIComponent(a.page||'portal')+(a.field?'&field='+encodeURIComponent(a.field):'')+(a.project?'&project='+encodeURIComponent(a.project):'')+(a.week?'&week='+encodeURIComponent(a.week):'');
  }
  function toggle(v){pop.hidden=!v;btn.setAttribute('aria-expanded',String(!!v));if(v){if(window.innerWidth<=760)pop.style.top=Math.round(btn.getBoundingClientRect().bottom+8)+'px';else pop.style.top='';paint()}}
  function load(force){
    var t=tok();if(!t||typeof google==='undefined'||!google.script)return;
    var ck='pmoNtfCache:'+t.slice(-12);
    if(!force){try{var c=JSON.parse(sessionStorage.getItem(ck)||'null');if(c&&Date.now()-c.t<180000){data=c.d;user=data.user||'';paint();return}}catch(e){}}
    google.script.run.withSuccessHandler(function(d){if(!d||!d.success)return;var before=unread().length;data=d;user=d.user||'';try{sessionStorage.setItem(ck,JSON.stringify({t:Date.now(),d:d}))}catch(e){}paint();if(unread().length>before&&!force){btn.classList.remove('ring');void btn.offsetWidth;btn.classList.add('ring')}}).withFailureHandler(function(){if(!data){data={items:[]};paint()}}).getNotifications(t);
  }
  function build(){

<script>
/* ===== Bagian 2 Controller: Top Progress Bar, CountUp, Reveal Animation & Interactive S-Curve Crosshair ===== */
(function(){
  if(window.__pmoBagian2Ready)return;window.__pmoBagian2Ready=true;

  // 1. Top Progress Bar + SWR Hook
  var bar=null,hideTm=0;
  function ensureBar(){
    if(bar||!document.body)return bar;
    bar=document.createElement('div');bar.id='pmoTopBar';bar.setAttribute('aria-hidden','true');
    document.body.appendChild(bar);return bar;
  }
  window.pmoTopProgress=function(on){
    var b=ensureBar();if(!b)return;
    clearTimeout(hideTm);
    if(on)b.classList.add('on');
    else hideTm=setTimeout(function(){b.classList.remove('on')},180);
  };
  function hookSwr(){
    if(!window.pmoSwr||window.pmoSwr.__b2Hooked)return;
    var origBusy=window.pmoSwr.busy,wasBusy=false;
    window.pmoSwr.busy=function(state,text){
      if(state===true){wasBusy=true;window.pmoTopProgress(true);return origBusy.call(this,true,text)}
      window.pmoTopProgress(false);
      if(state===false&&wasBusy){wasBusy=false;return origBusy.call(this,'\u2713 Data mutakhir')}
      wasBusy=false;return origBusy.call(this,state,text);
    };
    window.pmoSwr.__b2Hooked=true;
  }
  hookSwr();
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',hookSwr);

  // 2. Universal CountUp Helper
  window.pmoCountUp=function(el,to,fmt,dur){
    if(typeof el==='string')el=document.getElementById(el);
    if(!el)return;
    if(to==null||!isFinite(Number(to))){el.textContent='—';return}
    var target=Number(to);
    var format=fmt||function(v){return Math.round(v).toLocaleString('id-ID')};
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=format(target);return}
    var prev=Number(el.getAttribute('data-pmo-val'));
    if(!isFinite(prev))prev=0;
    el.setAttribute('data-pmo-val',String(target));
    if(Math.abs(target-prev)<1e-6){el.textContent=format(target);return}
    var t0=performance.now(),d=dur||650;
    if(el._pmoRaf)cancelAnimationFrame(el._pmoRaf);
    (function step(now){
      var k=Math.min(1,Math.max(0,(now-t0)/d)),e=1-Math.pow(1-k,3);
      el.textContent=format(prev+(target-prev)*e);
      if(k<1)el._pmoRaf=requestAnimationFrame(step);
      else{el.textContent=format(target);el._pmoRaf=0}
    })(t0);
  };

  // 3. Universal Interactive S-Curve Tooltip & Crosshair
  var tip=null;
  function getTip(){
    if(tip)return tip;
    tip=document.createElement('div');tip.className='pmo-scurve-tip';tip.setAttribute('role','tooltip');
    document.body.appendChild(tip);return tip;
  }
  function fmtPct(v,d){
    if(v==null||!isFinite(Number(v)))return '—';
    return Number(v).toLocaleString('id-ID',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})+'%';
  }
  function positionTip(t,clientX,clientY){
    var pad=14,w=t.offsetWidth||196,h=t.offsetHeight||110;
    var x=clientX+16,y=clientY-h-12;
    if(x+w+pad>window.innerWidth)x=Math.max(pad,clientX-w-16);
    if(y<pad)y=Math.min(window.innerHeight-h-pad,clientY+18);
    t.style.left=Math.round(x)+'px';
    t.style.top=Math.round(y)+'px';
  }
  window.pmoBindSCurve=function(svg,cfg){
    if(!svg||!cfg||!cfg.points||!cfg.points.length)return;
    svg._pmoSCurve=cfg;
    svg.style.touchAction='pan-y';
    var ns='http://www.w3.org/2000/svg';
    var ov=svg.querySelector('.pmo-sc-ov');
    if(!ov){
      ov=document.createElementNS(ns,'g');
      ov.setAttribute('class','pmo-sc-ov');
      ov.style.pointerEvents='none';
      ov.style.display='none';
      ov.innerHTML='<line class="pmo-sc-line" y1="'+cfg.T+'" y2="'+(cfg.H-cfg.B)+'" stroke="#0f5fa8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.85"/>'+
        '<circle class="pmo-sc-p" r="4.5" fill="#fff" stroke="'+(cfg.planColor||'#38bdf8')+'" stroke-width="2.5"/>'+
        '<circle class="pmo-sc-a" r="5" fill="'+(cfg.actColor||'#0a355d')+'" stroke="#fff" stroke-width="2"/>';
      svg.appendChild(ov);
    }
    if(svg._pmoBound)return;
    svg._pmoBound=true;
    var showAt=function(clientX,clientY){
      var c=svg._pmoSCurve;if(!c||!c.points||!c.points.length)return;
      var rect=svg.getBoundingClientRect();if(!rect.width)return;
      var vx=(clientX-rect.left)/rect.width*c.W;
      var best=null,bestDist=1e9;
      for(var i=0;i<c.points.length;i++){
        var pt=c.points[i],d=Math.abs(pt.x-vx);
        if(d<bestDist){bestDist=d;best=pt}
      }
      if(!best)return;
      var o=svg.querySelector('.pmo-sc-ov');
      if(o){
        o.style.display='';
        var ln=o.querySelector('.pmo-sc-line'),cp=o.querySelector('.pmo-sc-p'),ca=o.querySelector('.pmo-sc-a');
        ln.setAttribute('x1',best.x);ln.setAttribute('x2',best.x);
        ln.setAttribute('y1',c.T);ln.setAttribute('y2',c.H-c.B);
        if(best.plan!=null&&isFinite(best.plan)){cp.style.display='';cp.setAttribute('cx',best.x);cp.setAttribute('cy',best.yPlan)}else cp.style.display='none';
        if(best.actual!=null&&isFinite(best.actual)){ca.style.display='';ca.setAttribute('cx',best.x);ca.setAttribute('cy',best.yAct)}else ca.style.display='none';
      }
      var dev=(best.actual!=null&&best.plan!=null&&isFinite(best.actual)&&isFinite(best.plan))?(best.actual-best.plan):null;
      var devCls=dev==null?'':dev>=0?'pos':dev>=-2?'warn':'neg';
      var t=getTip(),dec=c.decimals!=null?c.decimals:2;
      t.innerHTML='<div class="st-h"><span>'+(best.label||('WEEK '+best.week))+'</span>'+(best.badge?'<small>'+best.badge+'</small>':'')+'</div>'+
        '<div class="st-r"><span><i style="background:'+(c.planColor||'#38bdf8')+'"></i>'+(c.planLabel||'Plan')+'</span><b>'+fmtPct(best.plan,dec)+'</b></div>'+
        '<div class="st-r"><span><i style="background:'+(c.actColor||'#0ea5e9')+'"></i>'+(c.actLabel||'Aktual')+'</span><b>'+fmtPct(best.actual,dec)+'</b></div>'+
        (dev!=null?'<div class="st-dev '+devCls+'"><span>Deviasi</span><b>'+(dev>0?'+':dev<0?'\u2212':'')+fmtPct(Math.abs(dev),dec).replace('%','')+' pp</b></div>':'');
      t.classList.add('on');
      positionTip(t,clientX,clientY);
    };
    var hide=function(){
      var o=svg.querySelector('.pmo-sc-ov');if(o)o.style.display='none';
      if(tip)tip.classList.remove('on');
    };
    svg.addEventListener('mousemove',function(e){showAt(e.clientX,e.clientY)});
    svg.addEventListener('mouseleave',hide);
    svg.addEventListener('touchstart',function(e){if(e.touches&&e.touches[0])showAt(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
    svg.addEventListener('touchmove',function(e){if(e.touches&&e.touches[0])showAt(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
    svg.addEventListener('touchend',function(){setTimeout(hide,1400)},{passive:true});
  };
})();
</script>

.pmo-epc-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:2px 4px 4px}
.pmo-epc-pill{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;border:1px solid var(--line,#263b4f);background:var(--tint,#f4f8fc);color:var(--ink,#132b43);font:600 12px/1.25 var(--pmo-font,Inter,sans-serif);text-align:left;cursor:pointer;transition:all .15s;min-width:0}
.pmo-epc-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmo-epc-pill:hover{background:var(--soft,#e8f3fb);border-color:var(--pri,#0f5fa8);transform:translateY(-1px)}
.pmo-epc-pill .dot,.pmo-epc-sub .dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.dot.eng{background:#38bdf8}.dot.proc{background:#a855f7}.dot.cons{background:#f59e0b}.dot.com{background:#14b8a6}
.side .nav.pmo-epc-sub{padding:9px 12px;font-size:13px;font-weight:500;color:var(--ink)}
.side .nav.pmo-epc-sub.on,.side .nav.pmo-epc-sub.active{background:var(--pri);color:#fff;font-weight:700}
.app.collapsed .pmo-mod-hd span,.app.collapsed .pmo-mod-hd .sg-c,.app.collapsed .pmo-mod-hd .sg-n,.app.collapsed .pmo-epc-grid{display:none!important}
.app.collapsed .side .sec.pmo-mod-hd{justify-content:center;margin:8px 4px 4px!important;padding:4px 0;pointer-events:none}
</style>
<script>
/* ===== Modular Sidebar Controller: Group by Module, Minimize per Module (Except M1), 1-Click EPCC & Sticky Project ===== */
(function(){
  if(window.__pmoModSidebarInit)return;window.__pmoModSidebarInit=true;
  var STORAGE_KEY='pmoModSideStateV1';
  var CHEV_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  var CAM_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11a2 2 0 012 2v6a2 2 0 01-2 2H3z"/><path d="M16 11l5-3v8l-5-3"/></svg>';
  var PRT_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></svg>';

  function baseUrl(){
    try{if(typeof appUrl!=='undefined'&&appUrl)return appUrl}catch(e){}
    return String(window.location.href).split('?')[0];
  }
  function getActiveProject(){
    var el=document.getElementById('pjName');
    if(el){
      var t=String(el.textContent||'').trim();
      if(t&&t!=='\u2013'&&t!=='-'&&!/^Memuat/i.test(t)){
        try{sessionStorage.setItem('pmoActiveProject',t)}catch(e){}
        return t;
      }
    }
    var sels=document.querySelectorAll('select#project,select#projSel,select#projectSelect');
    for(var i=0;i<sels.length;i++){
      var s=sels[i];
      if(s&&s.options&&s.selectedIndex>=0){
        var opt=s.options[s.selectedIndex];
        var txt=opt?String(opt.textContent||'').trim():'';
        if(txt&&!/^(Pilih|Memuat|Semua)\b/i.test(txt)){
          try{sessionStorage.setItem('pmoActiveProject',txt)}catch(e){}
          return txt;
        }
      }
    }
    try{
      var u=new URL(window.location.href);
      var qp=u.searchParams.get('project');
      if(qp){sessionStorage.setItem('pmoActiveProject',qp);return qp;}
    }catch(e){}
    try{return sessionStorage.getItem('pmoActiveProject')||''}catch(e){return ''}
  }
  window.pmoGoWithProject=function(pageAndQuery){
    var unsaved=false;try{unsaved=typeof dirty!=='undefined'&&!!dirty}catch(e){}
    if(unsaved&&!window.confirm('Ada perubahan yang belum disimpan. Tetap pindah halaman?'))return;
    try{dirty=false}catch(e){}window.onbeforeunload=null;
    var pj=getActiveProject();
    var target=baseUrl()+'?page='+pageAndQuery;
    if(pj&&!/[?&]project=/.test(target)&&!/^(portal|executive|project)$/.test(pageAndQuery)){
      target+='&project='+encodeURIComponent(pj);
    }
    window.top.location.href=target;
  };

  function isBtnVisible(b){
    if(!b||b.hidden||b.style.display==='none')return false;
    return true;
  }

  function setupModularSidebar(){
    var side=document.querySelector('aside.side');
    if(!side)return;
    var nav=side.querySelector('nav');
    if(!nav||nav.getAttribute('data-pmo-modular')==='1')return;
    nav.setAttribute('data-pmo-modular','1');

    var wkWrap=nav.querySelector('.weekly-nav-wrap');
    var subNavBox=nav.querySelector('#subNav');
    var allBtns=Array.prototype.slice.call(nav.querySelectorAll('button.nav'));

    var buckets={m1:[],m3:[],m2:[],m5:[],minp:[],isi:[]};
    var hasEpcSub=false;
    var mrRefBtn=null;
    var wpBtn=null;
    var hasWeeklyPrint=false;
    var hasMonthlyDoc=false;
    var mdBtn=null;
    var hasLiveView=false;
    var hasLibrary=false;

    allBtns.forEach(function(b){
      if(wkWrap&&wkWrap.contains(b)){
        if(buckets.m1.indexOf(wkWrap)<0)buckets.m1.push(wkWrap);
        return;
      }
      if(subNavBox&&subNavBox.contains(b))return;
      var title=String(b.getAttribute('title')||b.textContent||'').trim();
      var df=b.getAttribute('data-field');
      if(df||b.classList.contains('fld')){
        hasEpcSub=true;
        b.classList.remove('sub');
        b.classList.add('pmo-epc-sub');
        buckets.m3.push(b);
        return;
      }
      if(b.classList.contains('sub')||b.hasAttribute('data-goto')||b.hasAttribute('data-target')){
        buckets.isi.push(b);
        return;
      }
      if(/Portal proyek/i.test(title)||/Executive Dashboard/i.test(title)||b.id==='navExec'||b.classList.contains('master-monitoring-link')||/Master Schedule/i.test(title)||/Weekly Progress/i.test(title)||b.id==='navWeekly'||b.id==='weeklyMenuToggle'){
        buckets.m1.push(b);
        return;
      }
      if(/EPCC Control/i.test(title)||b.id==='navEpc'){
        b.classList.add('pmo-epc-main');
        buckets.m3.unshift(b);
        return;
      }
      if(/Library\s*(&|&amp;)?\s*Knowledge/i.test(title)){
        hasLibrary=true;
        buckets.m2.push(b);
        return;
      }
      if(/Document Control/i.test(title)){
        buckets.m2.push(b);
        return;
      }
      if(/Live View/i.test(title)){
        hasLiveView=true;
        buckets.m2.push(b);
        return;
      }
      if(/Pelaporan Manajemen/i.test(title)||b.hasAttribute('data-mr')){
        mrRefBtn=b;
        var sp=b.querySelector('span');if(sp)sp.textContent='Presentasi Bulanan';
        buckets.m5.push(b);
        return;
      }
      if(/Buat Laporan Bulanan/i.test(title)){
        hasMonthlyDoc=true;
        var mds=b.querySelector('span');if(mds)mds.textContent='Buat Laporan Bulanan';
        buckets.m5.push(b);
        return;
      }
      if(/Buat Laporan Weekly/i.test(title)){
        hasWeeklyPrint=true;
        var wps=b.querySelector('span');if(wps)wps.textContent='Buat Laporan Weekly';
        buckets.m5.push(b);
        return;
      }
      if(/Input Progress/i.test(title)||b.id==='navInput'||/Laporan Bulanan/i.test(title)||b.id==='navMonthly'||/Tambah \/ Edit Proyek/i.test(title)||b.id==='navProject'){
        buckets.minp.push(b);
        return;
      }
      buckets.m1.push(b);
    });

    if(subNavBox)buckets.isi.push(subNavBox);

    if(!hasLiveView){
      var liveBtn=document.createElement('button');
      liveBtn.type='button';
      liveBtn.className='nav';
      liveBtn.setAttribute('title','Live View Lapangan');
      liveBtn.innerHTML='<i class="ic">'+CAM_SVG+'</i><span>Live View CCTV</span>';
      liveBtn.onclick=function(){window.pmoGoWithProject('live')};
      buckets.m2.push(liveBtn);
    }

    if(!hasLibrary){
      var libRole='';try{var lu=JSON.parse(sessionStorage.getItem('pmoUser')||'null');libRole=String(lu&&lu.role||'').trim().toUpperCase()}catch(e){}
      var libBtn=document.createElement('button');
      libBtn.type='button';
      libBtn.className='nav';
      libBtn.setAttribute('title','Library & Knowledge');
      libBtn.innerHTML='<i class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6a3 3 0 013 3v13a2 2 0 00-2-2H4z"/><path d="M20 4h-6a3 3 0 00-3 3v13a2 2 0 012-2h7z"/></svg></i><span>Library &amp; Knowledge</span>';
      libBtn.onclick=function(){window.pmoGoWithProject('library')};
      if(libRole==='KONTRAKTOR')libBtn.hidden=true;
      var dcAt=-1;buckets.m2.forEach(function(x,i){if(/Document Control/i.test(String(x.getAttribute&&x.getAttribute('title')||x.textContent||'')))dcAt=i});
      buckets.m2.splice(dcAt+1,0,libBtn);
    }

    if(!hasWeeklyPrint&&mrRefBtn){
      wpBtn=document.createElement('button');
      wpBtn.type='button';
      wpBtn.className='nav';
      wpBtn.setAttribute('data-mr','');
      wpBtn.hidden=mrRefBtn.hidden;
      wpBtn.setAttribute('title','Buat Laporan Weekly');
      wpBtn.innerHTML='<i class="ic">'+PRT_SVG+'</i><span>Cetak Laporan Weekly</span>';
      wpBtn.onclick=function(){window.pmoGoWithProject('weeklyprint')};
      buckets.m5.push(wpBtn);
    }

    if(!hasMonthlyDoc&&mrRefBtn){
      mdBtn=document.createElement('button');
      mdBtn.type='button';
      mdBtn.className='nav';
      mdBtn.setAttribute('data-mr','');
      mdBtn.hidden=mrRefBtn.hidden;
      mdBtn.setAttribute('title','Buat Laporan Bulanan');
      mdBtn.innerHTML='<i class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/></svg></i><span>Buat Laporan Bulanan</span>';
      mdBtn.onclick=function(){window.pmoGoWithProject('monthlydoc')};
      buckets.m5.push(mdBtn);
    }

    var st={},hasSavedState=false;
    try{
      var raw=localStorage.getItem(STORAGE_KEY);
      if(raw){st=JSON.parse(raw)||{};hasSavedState=true;}
    }catch(e){st={}}
    if(typeof st.m3!=='boolean')st.m3=false;
    if(typeof st.m2!=='boolean')st.m2=false;
    if(typeof st.m5!=='boolean')st.m5=true;
    if(typeof st.minp!=='boolean')st.minp=true;
    if(typeof st.isi!=='boolean')st.isi=false;

    var GROUPS=[
      {id:'m1',tag:'M1',title:'Dashboard Proyek',pinned:true},
      {id:'m3',tag:'M3',title:'EPCC Control',pinned:false},
      {id:'m2',tag:'M2\u00B7M4',title:'Dokumen & Lapangan',pinned:false},
      {id:'m5',tag:'M5',title:'Pelaporan Manajemen',pinned:false},
      {id:'minp',tag:'INPUT',title:'Input & Data Proyek',pinned:false},
      {id:'isi',tag:'ISI',title:'Isi Halaman',pinned:false}
    ];

    nav.innerHTML='';
    var grpEls={};

    GROUPS.forEach(function(g){
      var wrap=document.createElement('div');
      wrap.className='sgrp pmo-mgrp';
      wrap.setAttribute('data-mod-grp',g.id);

      var hd=document.createElement('div');
      if(g.pinned){
        hd.className='sec pmo-mod-hd is-pinned';
        hd.innerHTML='<em class="pmo-mod-tag '+g.id+'">'+g.tag+'</em><span>'+g.title+'</span>';
      }else{
        hd.className='sec sec-t pmo-mod-hd';
        hd.setAttribute('role','button');
        hd.setAttribute('tabindex','0');
        hd.setAttribute('data-mod-toggle',g.id);
        hd.setAttribute('title','Ringkas / tampilkan '+g.title);
        hd.innerHTML='<em class="pmo-mod-tag '+g.id+'">'+g.tag+'</em><span>'+g.title+'</span><i class="sg-n"></i><i class="ic sg-c">'+CHEV_SVG+'</i>';
        var toggleFn=function(){
          st[g.id]=!st[g.id];
          try{localStorage.setItem(STORAGE_KEY,JSON.stringify(st))}catch(e){}
          syncModules();
        };
        hd.onclick=toggleFn;
        hd.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleFn()}};
      }
      wrap.appendChild(hd);

      var list=buckets[g.id]||[];
      list.forEach(function(node){
        wrap.appendChild(node);
      });

      if(g.id==='m3'){
        wrap.classList.add('has-epc-children');
        if(!hasEpcSub){
          var grid=document.createElement('div');
          grid.className='pmo-epc-grid';
          var disciplines=[
            {code:'ENG',label:'Engineering',cls:'eng',route:'engineering'},
            {code:'PROC',label:'Procurement',cls:'proc',route:'epcc&field=PROC'},
            {code:'CONS',label:'Construction',cls:'cons',route:'epcc&field=CONS'},
            {code:'COM',label:'Commissioning',cls:'com',route:'epcc&field=COM'}
          ];
          disciplines.forEach(function(d){
            var p=document.createElement('button');
            p.type='button';
            p.className='pmo-epc-pill';
            p.setAttribute('title','EPCC Control \u00B7 '+d.label);
            p.innerHTML='<i class="dot '+d.cls+'"></i><span>'+d.label+'</span>';
            p.onclick=function(){window.pmoGoWithProject(d.route)};
            grid.appendChild(p);
          });
          wrap.appendChild(grid);
        }
      }

      nav.appendChild(wrap);
      grpEls[g.id]=wrap;
    });

    function syncModules(){
      if(mdBtn&&mrRefBtn){
        mdBtn.hidden=mrRefBtn.hidden;
        mdBtn.style.display=mrRefBtn.style.display;
      }
      if(wpBtn&&mrRefBtn){
        wpBtn.hidden=mrRefBtn.hidden;
        wpBtn.style.display=mrRefBtn.style.display;
      }
      GROUPS.forEach(function(g){
        var w=grpEls[g.id];if(!w)return;
        var items=Array.prototype.slice.call(w.querySelectorAll('button.nav')).filter(function(b){
          return !b.classList.contains('pmo-epc-main');
        });
        var visibleItems=items.filter(isBtnVisible);
        var hasGrid=!!w.querySelector('.pmo-epc-grid');

        if(!g.pinned&&visibleItems.length===0&&!hasGrid){
          w.hidden=true;
          return;
        }
        w.hidden=false;
        if(g.pinned)return;

        var hasActive=visibleItems.some(function(b){return b.classList.contains('active')||b.classList.contains('on')});
        if(!hasSavedState&&hasActive&&(g.id==='m5'||g.id==='minp')){
          st[g.id]=false;
        }
        var isMin=!!st[g.id];
        w.classList.toggle('min',isMin);
        var hd=w.querySelector('[data-mod-toggle]');
        if(hd)hd.setAttribute('aria-expanded',String(!isMin));
        var badge=w.querySelector('.sg-n');
        if(badge){
          var count=g.id==='m3'&&hasGrid?4:(visibleItems.length-(hasActive?1:0));
          badge.textContent=(isMin&&count>0)?('+'+count):'';
        }
      });
    }

    window.sideGrpSync=syncModules;
    syncModules();

    var syncRaf=0;
    function queueSync(){
      if(syncRaf)return;
      syncRaf=requestAnimationFrame(function(){syncRaf=0;syncModules()});
    }
    if(window.MutationObserver){
      var mo=new MutationObserver(function(muts){
        for(var i=0;i<muts.length;i++){
          var t=muts[i].target;
          if(t&&t.classList&&!t.classList.contains('pmo-mgrp')&&!t.classList.contains('pmo-mod-hd')){
            queueSync();
            break;
          }
        }
      });
      mo.observe(nav,{attributes:true,childList:true,subtree:true,attributeFilter:['hidden','style','class']});
    }

    setTimeout(getActiveProject,600);
    document.addEventListener('change',function(e){
      if(e.target&&(e.target.id==='project'||e.target.id==='projSel'||e.target.id==='projectSelect')){
        setTimeout(getActiveProject,50);
      }
    });
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setupModularSidebar);
  else setupModularSidebar();
})();

  // Sembunyikan popup blocking tengah saat loading data awal/ganti proyek (karena sudah ada Skeleton Loading + Top Bar)
  (function(){
    function hookBusy(){
      var b = document.getElementById('busy'), bt = document.getElementById('busyText');
      if (!b || !bt || b.__pmoHooked) return;
      b.__pmoHooked = true;
      var SUPPRESS = /^(Memproses|Memuat daftar proyek|Memuat register dok)/i;
      function check(){
        if (!b.hidden && SUPPRESS.test(String(bt.textContent || '').trim())) {
          b.style.opacity = '0';
          b.style.pointerEvents = 'none';
        } else if (!b.hidden) {
          b.style.opacity = '';
          b.style.pointerEvents = '';
        }
      }
      if (window.MutationObserver) {
        var mo = new MutationObserver(check);
        mo.observe(b, { attributes: true, attributeFilter: ['hidden'] });
        mo.observe(bt, { characterData: true, childList: true, subtree: true });
      }
      check();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', hookBusy);
    else hookBusy();
  })();
</script>

<script>
/* Navigasi HP seragam. Halaman dengan tampilan HP sendiri (Executive, Weekly, EPCC) tetap memakai dok bawahnya;
 * daftar halaman/modul di menu mereka diganti daftar standar yang sama (termasuk Master Schedule & Pelaporan Manajemen). */
(function(){

<script>
/* ===== Shimmer saat ganti proyek / periode =====

   kartu-kartu isi halaman diganti kerangka shimmer sampai data selesai dimuat. Alur data tidak diubah. */
(function(){
  if(window.pmoShimmer)return;
  var NAV=/^(project|projSel|projectSelect|fProject|periodSelect|week|weekSelect|month|monthSelect)$/,PROJ=/^(project|projSel|projectSelect|fProject)$/;

  var els=[],shown=0,armedUntil=0,pending={},seq=0,nPending=0,hideTm=0,capTm=0,hooked=false,mo=null;

  function hide(now){
