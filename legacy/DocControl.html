/* sidebar (sama dengan Weekly) */
.app{display:grid;grid-template-columns:var(--sw,268px) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s ease}
.main{min-width:0}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;overflow:hidden}
.side-head{display:flex;align-items:center;gap:10px;padding:16px 14px 12px 18px;min-height:76px}

.sbtn{width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}.sbtn:hover{background:var(--soft);color:var(--pri-ink)}

.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;margin:2px 0;border:0;border-radius:10px;background:transparent;color:var(--ink);font-size:14px;font-weight:500;text-align:left;white-space:nowrap}

.side-foot{padding:12px 14px 16px;border-top:1px solid var(--line)}
.pj{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border:0;border-radius:12px;background:var(--tint);text-align:left}

}
@media (max-width:900px){

}
@media (prefers-reduced-motion:reduce){.app,.side{transition:none}}

/* arsip */
.ar-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;margin-top:12px}
.ar-path{font-size:12px;color:var(--muted);background:var(--tint);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:8px 0 12px;word-break:break-word}.ar-path b{color:var(--ink)}
.ar-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--tint)}
.ar-card .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ar-card .h b{font-size:13.5px;word-break:break-all}.ar-card .h .st{margin-left:auto}
.ar-card small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.ar-bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px;display:flex}.ar-bar i{display:block;height:100%;background:var(--ok,#16875d);transition:width .3s}.ar-bar i.f{background:var(--bad,#c0302f)}
.ar-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ar-st{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700}.ar-st.run{background:var(--soft);color:var(--pri-ink)}.ar-st.done{background:var(--ok-bg);color:var(--ok)}
.ar-fail{margin-top:10px;font-size:12px;max-height:150px;overflow:auto;border-top:1px dashed var(--line);padding-top:8px}.ar-fail div{padding:2px 0;color:var(--warn)}
.zrow td{vertical-align:middle}.zrow .zs{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}.zrow .btn{min-height:34px;font-size:12px}
.ar-hist td{font-size:12.5px}
.ar-drv{margin:8px 0 12px}.ar-drv .panel{box-shadow:none;margin-top:6px!important;background:var(--tint)}
.lnkbtn{border:0;background:none;color:var(--pri-ink);font-weight:600;font-size:12px;padding:0 0 0 6px;cursor:pointer;text-decoration:underline}

function docUploadCall_(name,args){return new Promise(function(resolve,reject){const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){reject(new Error(e&&e.message||String(e)));});r[name].apply(r,args);});}
function docUploadRead_(blob){return new Promise(function(resolve,reject){const rd=new FileReader();rd.onerror=function(){reject(new Error('Bagian file tidak bisa dibaca.'));};rd.onload=function(){resolve(String(rd.result).split(',')[1]);};rd.readAsDataURL(blob);});}
async function docUploadFile_(file,a,form,pid){
  const binding=JSON.stringify({pid:pid,kat:a.kat,sub:a.sub,id:a.id||''});
  let job=form.upload;
  if(!job||job.file!==file||job.binding!==binding){
    const start=await docUploadCall_('beginDocUpload',[token,pid,a,{name:file.name,mime:file.type||'application/octet-stream',size:file.size}]);
    job=form.upload={file:file,binding:binding,id:start.uploadId,chunk:start.chunkBytes,status:start};
  }else job.status=await docUploadCall_('getDocUploadStatus',[token,pid,job.id]);
  let retry=0,stalls=0;
  while(!job.status.complete){
    if(FM!==form||D.project.id!==pid)throw new Error('Proyek atau formulir sudah berubah.');
    const offset=job.status.next;
    busy(true,'Mengunggah '+Math.floor(offset/file.size*100)+'% · '+(offset/1048576).toFixed(1)+' / '+(file.size/1048576).toFixed(1)+' MB');
    try{
      const raw=await docUploadRead_(file.slice(offset,Math.min(offset+job.chunk,file.size)));
      job.status=await docUploadCall_('uploadDocChunk',[token,pid,job.id,offset,raw]);retry=0;
      if(!job.status.complete&&job.status.next<=offset){if(++stalls>2)throw new Error('Unggah belum bergerak. Klik Simpan lagi untuk melanjutkan.');}else stalls=0;
    }catch(e){
      if(++retry>2||/kedaluwarsa|bukan milik|tidak valid|formulir sudah berubah|belum bergerak/i.test(e.message))throw e;
      await new Promise(function(resolve){setTimeout(resolve,retry*1000);});
      job.status=await docUploadCall_('getDocUploadStatus',[token,pid,job.id]);
    }
  }
  if(job.status.next!==file.size)throw new Error('Ukuran unggahan belum lengkap. Dokumen belum disimpan.');
  return job.id;
}

function zipSel(){

    google.script.run.withSuccessHandler(function(r){let fname='',note='';if(r.base64){const dir=(D.cats.indexOf(c)+1<10?'0':'')+(D.cats.indexOf(c)+1)+' '+c.n.replace(/[\\/:*?"<>|]+/g,'-');
        let base=[subName(d),refText(d),d.nomor,d.judul].filter(Boolean).join(' - ').replace(/[\\/:*?"<>|→]+/g,'-').slice(0,120)||r.name;fname=dir+'/'+base+r.ext;let k=2;while(used[fname]){fname=dir+'/'+base+' ('+k+++')'+r.ext}used[fname]=1;zip.file(fname,r.base64,{base64:true});ok++}else note=r.skip||'';

      .withFailureHandler(function(e){log.push([log.length,c.n,subName(d),refText(d),d.nomor||'',d.judul||'',d.tanggal||'','',String(e&&e.message||e),d.url||'']);next()}).getDocFileBytes(token,D.project.id,id)};
  const finish=function(){busy(true,'Menyusun ZIP…');zip.file('DAFTAR_ISI.csv','﻿'+log.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(';')}).join('\r\n'));
    zip.generateAsync({type:'blob'}).then(function(blob){busy(false);const a=document.createElement('a'),name='DOKUMEN_'+D.project.id+'_'+todayIso()+'.zip';a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);toast(name+' diunduh · '+ok+' dari '+total+' berkas.')}).catch(function(e){busy(false);toast('Gagal membuat ZIP: '+(e&&e.message?e.message:e))})};

function vwMicrosoft(d,seq){
  const active=function(){return seq===VW.seq&&!$('viewModal').hidden};
  const fail=function(){if(!active())return;vwState('<b>Pratinjau OneDrive belum bisa dimuat</b>Pastikan akun Anda memiliki akses file. Jika Microsoft meminta login atau menolak tampilan di dalam dashboard, buka berkas di tab baru.<br><a class="btn pri" href="'+esc(d.url)+'" target="_blank" rel="noopener">Buka di OneDrive</a>')};
  const frame=function(src){
    if(!active()||!/^https:\/\//i.test(src))return;
    $('vwMain').innerHTML='<div class="vw-ms"><div class="vw-ms-note">Pratinjau OneDrive / Microsoft 365. Jika kosong atau meminta login, <a href="'+esc(d.url)+'" target="_blank" rel="noopener">buka berkas di tab baru</a>.</div><iframe title="Pratinjau '+esc(d.judul)+'" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>';
    const f=$('vwMain').querySelector('iframe');f.referrerPolicy='no-referrer';f.onerror=fail;f.src=src;
  };
  const plan=window.pmoDocMicrosoft.plan(d.url);if(!plan){fail();return}
  if(plan.src){frame(plan.src);return}
  if(!plan.od){fail();return}
  vwState('<div class="vw-spin"></div>Menyiapkan pratinjau OneDrive…');
  window.pmoDocMicrosoft.resolve(plan.link).then(function(it){
    if(!active())return;const dl=String(it['@content.downloadUrl']||''),name=String(it.name||''),mime=String(it.file&&it.file.mimeType||'');
    if(!/^https:\/\//i.test(dl))throw new Error('Tautan pratinjau tidak tersedia.');
    if(/^image\//.test(mime)||/\.(png|jpe?g|gif|webp)$/i.test(name)){$('vwMain').innerHTML='<div class="vw-img"><img alt="'+esc(name)+'" style="max-width:100%"></div>';const im=$('vwMain').querySelector('img');im.onerror=fail;im.src=dl;return}
    frame(/\.(docx?|xlsx?|pptx?)$/i.test(name)?'https://view.officeapps.live.com/op/embed.aspx?src='+encodeURIComponent(dl):'https://docs.google.com/viewer?embedded=true&url='+encodeURIComponent(dl));
  }).catch(fail);
}

let pdfLibP=null;
function vwPdfLib(){if(pdfLibP)return pdfLibP;pdfLibP=import(PDFJS+'pdf.min.mjs').then(function(lib){
    return fetch(PDFJS+'pdf.worker.min.mjs').then(function(r){return r.text()}).then(function(t){lib.GlobalWorkerOptions.workerPort=new Worker(URL.createObjectURL(new Blob([t],{type:'text/javascript'})),{type:'module'});return lib}).catch(function(){lib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.mjs';return lib})})
  .catch(function(e){pdfLibP=null;throw new Error('Pustaka PDF gagal dimuat ('+(e&&e.message?e.message:e)+').')});return pdfLibP}
function vwRenderPdf(){const pdf=VW.pdf,box=$('vwPdf');if(!pdf||!box)return;const seq=VW.seq,w=Math.max(280,$('vwMain').clientWidth-40),dpr=window.devicePixelRatio||1;box.innerHTML='';
  const one=function(n){if(n>pdf.numPages||seq!==VW.seq)return;pdf.getPage(n).then(function(pg){if(seq!==VW.seq)return;const v0=pg.getViewport({scale:1}),sc=Math.min(w/v0.width,2.5)*VW.zoom,v=pg.getViewport({scale:sc*dpr});
    const cv=document.createElement('canvas');cv.width=Math.floor(v.width);cv.height=Math.floor(v.height);cv.style.width=Math.floor(v.width/dpr)+'px';cv.style.height=Math.floor(v.height/dpr)+'px';box.appendChild(cv);
    return pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise}).then(function(){one(n+1)})};one(1)}

init();
</script>

<script>
(function(){
function enc(s){return encodeURIComponent(s)}
  function plan(raw){
    var u;try{u=new URL(String(raw||'').trim())}catch(e){return null}
    if(!/^https?:$/.test(u.protocol))return null;
    var h=u.hostname.toLowerCase(),p=u.pathname,m,id;
    if(h==='drive.google.com'){
      if((m=p.match(/\/file\/d\/([^/]+)/)))return {src:'https://drive.google.com/file/d/'+enc(m[1])+'/preview',refit:true};
      if((m=p.match(/\/folders\/([^/?#]+)/)))return {src:'https://drive.google.com/embeddedfolderview?id='+enc(m[1])+'#grid'};
      id=u.searchParams.get('id');if(id)return {src:'https://drive.google.com/file/d/'+enc(id)+'/preview',refit:true};
      return null;
    }
    if(h==='docs.google.com'){
      if((m=p.match(/^\/(document|spreadsheets|presentation|drawings)\/d\/([^/]+)/)))return {src:'https://docs.google.com/'+m[1]+'/d/'+enc(m[2])+'/preview'};
      if((m=p.match(/^\/file\/d\/([^/]+)/)))return {src:'https://drive.google.com/file/d/'+enc(m[1])+'/preview',refit:true};
      return null;
    }
    if(h==='youtu.be'||/(^|\.)youtube\.com$/.test(h)){
      id=h==='youtu.be'?p.split('/').filter(Boolean)[0]:(u.searchParams.get('v')||((p.match(/\/(?:embed|shorts|live)\/([^/]+)/)||[])[1]));
      return id?{src:'https://www.youtube-nocookie.com/embed/'+enc(id)}:null;
    }
    if(h==='1drv.ms'&&/^\/[bui]\//.test(p)){u.searchParams.delete('action');return {od:true,link:u.href}}
    if(h==='onedrive.live.com'&&/file,(pdf|png|jpe?g|gif|webp)/i.test(u.searchParams.get('ithint')||'')&&u.searchParams.get('redeem')){try{return {od:true,link:atob(u.searchParams.get('redeem').replace(/-/g,'+').replace(/_/g,'/'))}}catch(e){}}
    if(h==='1drv.ms'||h==='onedrive.live.com'||/(^|\.)sharepoint\.com$/.test(h)){
      if(h==='onedrive.live.com'&&/^\/(redir|view\.aspx)$/i.test(p)&&u.searchParams.get('resid')){u.pathname='/embed';return {src:u.href}}
      u.searchParams.set('action','embedview');return {src:u.href,ms:/sharepoint\.com$/.test(h)};
    }
    if(/\.pdf$/i.test(p))return {src:'https://docs.google.com/viewer?embedded=true&url='+enc(u.href)};
    if(/\.(png|jpe?g|gif|webp|svg)$/i.test(p))return {src:u.href,img:true};
    if(/\.(docx?|xlsx?|pptx?)$/i.test(p))return {src:'https://view.officeapps.live.com/op/embed.aspx?src='+enc(u.href)};
    return null;
  }
  var odTok=null;
  function odToken(){
    if(odTok&&odTok.exp>Date.now()+60000)return Promise.resolve(odTok.t);
    return fetch('https://api-badgerp.svc.ms/v1.0/token',{method:'POST',headers:{'Content-Type':'application/json','AppId':'5cbed6ac-a083-4e14-b191-b4ba07653de2'},body:JSON.stringify({appId:'5cbed6ac-a083-4e14-b191-b4ba07653de2'})})
      .then(function(r){if(!r.ok)throw new Error('token '+r.status);return r.json()})
      .then(function(j){odTok={t:j.token,exp:Date.parse(j.expiryTimeUtc)||Date.now()+1800000};return j.token});
  }
  function odResolve(link){
    var id='u!'+btoa(unescape(encodeURIComponent(link))).replace(/=+$/,'').replace(/\//g,'_').replace(/\+/g,'-');
    return odToken().then(function(t){return fetch('https://my.microsoftpersonalcontent.com/_api/v2.0/shares/'+id+'/driveitem?$select=name,file,@content.downloadUrl',{headers:{Authorization:'Badger '+t,Prefer:'autoredeem'}})})
      .then(function(r){if(!r.ok)throw new Error('item '+r.status);return r.json()});
  }

window.pmoDocMicrosoft={plan:plan,resolve:odResolve,isMicrosoft:function(raw){try{var u=new URL(raw),h=u.hostname.toLowerCase();return u.protocol==='https:'&&(h==='1drv.ms'||h==='onedrive.live.com'||/(^|\.)sharepoint\.com$/.test(h))}catch(e){return false}}};
})();
</script>
