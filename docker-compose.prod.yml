# Jalur deploy alternatif: satu compose berisi aplikasi dan database.
# Dipakai kalau Anda memilih resource "Docker Compose" di Coolify, bukan
# Application + Database terpisah. Untuk pemula, jalur di DEPLOY.md lebih mudah.
#
# Catatan: Coolify biasanya menyuntikkan label Traefik dari kolom Domains.
# Kalau routing tidak jalan, tambahkan label secara manual di service app.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmo}
      POSTGRES_USER: ${POSTGRES_USER:-pmo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pmo} -d ${POSTGRES_DB:-pmo}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-pmo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pmo}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-6}
      LEGACY_PBKDF2_ITERATIONS: ${LEGACY_PBKDF2_ITERATIONS:-120000}
      LEGACY_PBKDF2_KEYLEN: ${LEGACY_PBKDF2_KEYLEN:-32}
    expose:
      - "3000"
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
